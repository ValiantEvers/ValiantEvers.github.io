<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f4efe6;
    --warm: #faf7f1;
    --navy: #0d1e30;
    --navy-2: #1a3352;
    --green: #2e9b68;
    --green-light: #eaf6f0;
    --border: #e2ddd4;
    --muted: #606d7a;
    --font-display: 'Cormorant Garamond', serif;
    --font-body: 'Manrope', sans-serif;
    --step-color: var(--green);
  }

  html { scroll-behavior: smooth; }
  body { background: var(--bg); color: var(--navy); font-family: var(--font-body); min-height: 100vh; }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes slideUp { from { opacity: 0; transform: translateY(32px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }

  /* Progress bar */
  #progress-bar-track {
    position: fixed; top: 0; left: 0; right: 0; height: 3px;
    background: rgba(0,0,0,0.08); z-index: 100;
  }
  #progress-bar-fill {
    height: 100%; background: var(--green);
    transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    border-radius: 0 2px 2px 0;
  }

  /* Step pill */
  #step-pill {
    position: fixed; top: 12px; right: 16px; z-index: 101;
    background: var(--warm); border: 1px solid var(--border);
    border-radius: 99px; padding: 6px 14px;
    font-family: var(--font-body); font-size: 12px; font-weight: 700;
    color: var(--muted); letter-spacing: 0.05em;
    box-shadow: 0 2px 12px rgba(0,0,0,0.07);
    transition: opacity 0.3s;
  }

  /* Tweaks panel */
  #tweaks-panel {
    display: none;
    position: fixed; bottom: 24px; right: 24px; z-index: 200;
    background: var(--warm); border: 1px solid var(--border);
    border-radius: 20px; padding: 20px 22px; width: 280px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.12);
    animation: fadeIn 0.2s ease;
  }
  #tweaks-panel.visible { display: block; }
  .tweak-label { font-family: var(--font-body); font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; display: block; }
  .tweak-row { margin-bottom: 16px; }
  .tweak-select, .tweak-color {
    width: 100%; padding: 8px 12px; border: 1px solid var(--border);
    border-radius: 10px; background: white; font-family: var(--font-body);
    font-size: 13px; font-weight: 600; color: var(--navy); cursor: pointer;
  }
</style>

<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accentColor": "#367859",
  "bgTone": "slate",
  "fontSize": "comfortable"
}/*EDITMODE-END*/;

// ─── Apply tweaks ─────────────────────────────────────────────
function applyTweaks(t) {
  const root = document.documentElement;
  root.style.setProperty('--green', t.accentColor);
  root.style.setProperty('--green-light', t.accentColor + '18');
  const bgs = { beige: '#f4efe6', slate: '#eff2f4', cream: '#f8f4ec' };
  root.style.setProperty('--bg', bgs[t.bgTone] || bgs.beige);
  const sizes = { compact: '14px', comfortable: '16px', large: '18px' };
  root.style.fontSize = sizes[t.fontSize] || sizes.comfortable;
}

// ─── Data ─────────────────────────────────────────────────────
const STEPS = [
  { id: 1, color: '#2e9b68', label: 'Penger først',           icon: '💰', subtitle: 'Buffer, budsjett og kredittkort' },
  { id: 2, color: '#3a7bd5', label: 'Penger vokser',          icon: '📈', subtitle: 'Rente, avkastning og inflasjon' },
  { id: 3, color: '#e07b3a', label: 'Investering',            icon: '🏦', subtitle: 'Aksjer, fond og risiko' },
  { id: 4, color: '#8b5cf6', label: 'Kontoer og skatt',       icon: '📋', subtitle: 'ASK, IPS, BSU og mer' },
  { id: 5, color: '#0ea5e9', label: 'Tankesett',              icon: '🧠', subtitle: 'Prinsipper fra de beste' },
  { id: 6, color: '#ef4444', label: 'Vanlige feil',           icon: '⚠️', subtitle: 'Hva du bør unngå' },
];

const STEP_COMPONENTS = [Step1, Step2, Step3, Step4, Step5, Step6];

// ─── Hero ─────────────────────────────────────────────────────
function Hero({ onStart }) {
  return (
    <div style={{
      minHeight: '100vh', background: 'var(--navy)',
      display: 'flex', flexDirection: 'column',
      justifyContent: 'center', alignItems: 'center',
      padding: '40px 24px', textAlign: 'center', position: 'relative', overflow: 'hidden',
    }}>
      {/* Decorative circles */}
      {[
        { w: 600, h: 600, top: -200, right: -200, opacity: 0.04 },
        { w: 400, h: 400, bottom: -150, left: -100, opacity: 0.05 },
      ].map((c, i) => (
        <div key={i} style={{
          position: 'absolute', width: c.w, height: c.h,
          top: c.top, bottom: c.bottom, left: c.left, right: c.right,
          borderRadius: '50%', border: '1px solid white', opacity: c.opacity,
          pointerEvents: 'none',
        }} />
      ))}

      <div style={{ maxWidth: '620px', animation: 'slideUp 0.8s cubic-bezier(0.16,1,0.3,1) both' }}>
        <div style={{
          display: 'inline-flex', alignItems: 'center', gap: '8px',
          padding: '7px 18px', borderRadius: '99px',
          border: '1px solid rgba(255,255,255,0.15)',
          marginBottom: '40px',
        }}>
          <div style={{ width: '6px', height: '6px', borderRadius: '50%', background: 'var(--green)', animation: 'pulse 2s infinite' }} />
          <span style={{ fontFamily: 'var(--font-body)', fontSize: '12px', fontWeight: '700', letterSpacing: '0.12em', textTransform: 'uppercase', color: 'rgba(255,255,255,0.5)' }}>Finansiell utdanning</span>
        </div>

        <h1 style={{
          fontFamily: 'var(--font-display)', fontSize: 'clamp(52px, 9vw, 96px)',
          fontWeight: '700', color: 'white', lineHeight: '1.0',
          letterSpacing: '-0.01em', marginBottom: '28px',
        }}>
          Fra null<br />
          <em style={{ color: '#7de8b2' }}>til investor</em>
        </h1>

        <p style={{
          fontFamily: 'var(--font-body)', fontSize: 'clamp(16px, 2.5vw, 20px)',
          color: 'rgba(255,255,255,0.55)', lineHeight: '1.7',
          maxWidth: '480px', margin: '0 auto 52px',
        }}>
          Lær hvordan penger og investering fungerer – enkelt forklart, steg for steg.
        </p>

        <button onClick={onStart} style={{
          padding: '18px 52px', background: 'var(--green)', color: 'white',
          border: 'none', borderRadius: '99px', cursor: 'pointer',
          fontFamily: 'var(--font-body)', fontSize: '16px', fontWeight: '800',
          letterSpacing: '0.03em', transition: 'all 0.2s',
          boxShadow: '0 0 0 0 rgba(46,155,104,0.4)',
        }}
          onMouseOver={e => { e.currentTarget.style.transform = 'scale(1.04)'; e.currentTarget.style.boxShadow = '0 8px 32px rgba(46,155,104,0.4)'; }}
          onMouseOut={e => { e.currentTarget.style.transform = 'scale(1)'; e.currentTarget.style.boxShadow = '0 0 0 0 rgba(46,155,104,0.4)'; }}
        >
          Start reisen →
        </button>

        <div style={{ marginTop: '60px', display: 'flex', justifyContent: 'center', gap: '8px', flexWrap: 'wrap' }}>
          {STEPS.map(s => (
            <div key={s.id} style={{
              padding: '8px 16px', borderRadius: '99px',
              border: '1px solid rgba(255,255,255,0.1)',
              fontFamily: 'var(--font-body)', fontSize: '13px', fontWeight: '600',
              color: 'rgba(255,255,255,0.5)',
            }}>
              {s.icon} {s.label}
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

// ─── Step view ────────────────────────────────────────────────
function StepView({ step, onNext, onBack }) {
  const idx = step - 1;
  const meta = STEPS[idx];
  const StepContent = STEP_COMPONENTS[idx];
  const isLast = step === STEPS.length;

  React.useEffect(() => {
    window.scrollTo({ top: 0, behavior: 'smooth' });
    // Update progress bar
    const fill = ((step) / (STEPS.length + 1)) * 100;
    document.getElementById('progress-bar-fill').style.width = fill + '%';
    document.getElementById('step-pill').style.opacity = 1;
    document.getElementById('step-pill').textContent = `Steg ${step} av ${STEPS.length}`;
    // Update accent
    document.documentElement.style.setProperty('--step-color', meta.color);
  }, [step]);

  return (
    <div style={{ minHeight: '100vh', paddingBottom: '80px' }}>
      {/* Step header */}
      <div style={{
        background: 'var(--navy)', padding: '56px 24px 40px',
        textAlign: 'center',
      }}>
        <div style={{ maxWidth: '640px', margin: '0 auto', animation: 'slideUp 0.5s ease both' }}>
          <div style={{
            display: 'inline-flex', alignItems: 'center', gap: '10px',
            padding: '7px 20px', borderRadius: '99px',
            background: meta.color + '22', marginBottom: '20px',
          }}>
            <span style={{ fontFamily: 'var(--font-body)', fontSize: '12px', fontWeight: '800', letterSpacing: '0.1em', textTransform: 'uppercase', color: meta.color }}>Steg {step} av {STEPS.length}</span>
          </div>

          <div style={{ fontSize: '48px', marginBottom: '12px' }}>{meta.icon}</div>
          <h2 style={{ fontFamily: 'var(--font-display)', fontSize: 'clamp(36px, 7vw, 60px)', fontWeight: '700', color: 'white', lineHeight: 1.1, marginBottom: '12px' }}>{meta.label}</h2>
          <p style={{ fontFamily: 'var(--font-body)', fontSize: '16px', color: 'rgba(255,255,255,0.45)', letterSpacing: '0.02em' }}>{meta.subtitle}</p>
        </div>
      </div>

      {/* Step progress dots */}
      <div style={{ display: 'flex', justifyContent: 'center', gap: '8px', padding: '20px 0 0', background: 'var(--navy)' }}>
        {STEPS.map((s, i) => (
          <div key={i} style={{
            width: i === idx ? '28px' : '8px', height: '8px',
            borderRadius: '99px',
            background: i < step ? meta.color : i === idx ? meta.color : 'rgba(255,255,255,0.15)',
            transition: 'all 0.4s cubic-bezier(0.4,0,0.2,1)',
          }} />
        ))}
      </div>

      {/* Content */}
      <div style={{ maxWidth: '680px', margin: '0 auto', padding: '40px 24px 0' }}>
        <div style={{ animation: 'slideUp 0.5s cubic-bezier(0.16,1,0.3,1) both' }}>
          <StepContent />
        </div>

        {/* Navigation */}
        <div style={{ marginTop: '52px', display: 'flex', gap: '12px', justifyContent: 'space-between', alignItems: 'center', borderTop: '1px solid var(--border)', paddingTop: '28px' }}>
          <button onClick={onBack} style={{
            padding: '14px 28px', borderRadius: '99px',
            border: '2px solid var(--border)', background: 'transparent',
            cursor: 'pointer', fontFamily: 'var(--font-body)', fontSize: '14px',
            fontWeight: '700', color: 'var(--muted)', transition: 'all 0.2s',
          }}
            onMouseOver={e => { e.currentTarget.style.borderColor = 'var(--navy)'; e.currentTarget.style.color = 'var(--navy)'; }}
            onMouseOut={e => { e.currentTarget.style.borderColor = 'var(--border)'; e.currentTarget.style.color = 'var(--muted)'; }}
          >← Tilbake</button>

          <div style={{ textAlign: 'right' }}>
            {!isLast && (
              <p style={{ fontFamily: 'var(--font-body)', fontSize: '12px', color: 'var(--muted)', marginBottom: '8px', letterSpacing: '0.05em' }}>
                Neste: {STEPS[idx + 1]?.icon} {STEPS[idx + 1]?.label}
              </p>
            )}
            <button onClick={onNext} style={{
              padding: '16px 40px', background: meta.color, color: 'white',
              border: 'none', borderRadius: '99px', cursor: 'pointer',
              fontFamily: 'var(--font-body)', fontSize: '15px', fontWeight: '800',
              letterSpacing: '0.03em', transition: 'all 0.2s',
            }}
              onMouseOver={e => e.currentTarget.style.transform = 'scale(1.03)'}
              onMouseOut={e => e.currentTarget.style.transform = 'scale(1)'}
            >
              {isLast ? 'Se oppsummering →' : 'Neste steg →'}
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

// ─── Final ────────────────────────────────────────────────────
function Final({ onRestart }) {
  React.useEffect(() => {
    document.getElementById('progress-bar-fill').style.width = '100%';
    document.getElementById('step-pill').style.opacity = 0;
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }, []);

  const achievements = [
    { icon: '🛡', text: 'Du vet hvorfor buffer er viktigere enn investering' },
    { icon: '📈', text: 'Du forstår rentes rente og inflasjonseffekten' },
    { icon: '🏦', text: 'Du kjenner aksjer, fond og risiko' },
    { icon: '📋', text: 'Du vet hvilken konto som passer deg' },
    { icon: '🧠', text: 'Du har et sunt investerings-tankesett' },
    { icon: '⚠️', text: 'Du kjenner de vanligste fellene – og unngår dem' },
  ];

  return (
    <div style={{ minHeight: '100vh', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', padding: '60px 24px', textAlign: 'center' }}>
      <div style={{ maxWidth: '600px', animation: 'slideUp 0.7s cubic-bezier(0.16,1,0.3,1) both' }}>
        <div style={{ fontSize: '64px', marginBottom: '24px' }}>🎉</div>

        <h2 style={{ fontFamily: 'var(--font-display)', fontSize: 'clamp(42px, 8vw, 72px)', fontWeight: '700', color: 'var(--navy)', lineHeight: 1.05, marginBottom: '20px' }}>
          Du er i gang.
        </h2>

        <p style={{ fontFamily: 'var(--font-body)', fontSize: '18px', color: 'var(--muted)', lineHeight: '1.7', marginBottom: '48px', maxWidth: '440px', margin: '0 auto 48px' }}>
          Du har fullført alle 6 steg. Det som skiller de som bygger formue fra de som ikke gjør det, er ikke intelligens – det er at de faktisk startet.
        </p>

        <div style={{ background: 'var(--warm)', border: '1px solid var(--border)', borderRadius: '24px', padding: '32px', marginBottom: '40px', textAlign: 'left' }}>
          <p style={{ fontFamily: 'var(--font-body)', fontSize: '12px', fontWeight: '700', letterSpacing: '0.08em', textTransform: 'uppercase', color: 'var(--muted)', marginBottom: '20px' }}>Du har lært</p>
          <div style={{ display: 'grid', gap: '14px' }}>
            {achievements.map((a, i) => (
              <div key={i} style={{ display: 'flex', gap: '14px', alignItems: 'center' }}>
                <span style={{ fontSize: '22px', flexShrink: 0 }}>{a.icon}</span>
                <p style={{ fontFamily: 'var(--font-body)', fontSize: '15px', color: 'var(--navy)', lineHeight: '1.5' }}>{a.text}</p>

        <div style={{ display: 'flex', gap: '12px', justifyContent: 'center', flexWrap: 'wrap' }}>
          <button onClick={onRestart} style={{
            padding: '16px 36px', borderRadius: '99px',
            border: '2px solid var(--border)', background: 'transparent',
            cursor: 'pointer', fontFamily: 'var(--font-body)', fontSize: '15px',
            fontWeight: '700', color: 'var(--muted)', transition: 'all 0.2s',
          }}
            onMouseOver={e => { e.currentTarget.style.borderColor = 'var(--navy)'; e.currentTarget.style.color = 'var(--navy)'; }}
            onMouseOut={e => { e.currentTarget.style.borderColor = 'var(--border)'; e.currentTarget.style.color = 'var(--muted)'; }}
          >↺ Ta kurset igjen</button>

          <a href="https://www.evers.no/fra-null-til-investor2/" style={{
            padding: '16px 36px', borderRadius: '99px',
            background: 'var(--green)', color: 'white',
            border: 'none', cursor: 'pointer', textDecoration: 'none',
            fontFamily: 'var(--font-body)', fontSize: '15px', fontWeight: '800',
            letterSpacing: '0.03em', transition: 'all 0.2s', display: 'inline-block',
          }}
            onMouseOver={e => e.currentTarget.style.transform = 'scale(1.03)'}
            onMouseOut={e => e.currentTarget.style.transform = 'scale(1)'}
          >Del 2: Kom i gang →</a>

          <a href="https://www.evers.no" style={{
            padding: '16px 36px', borderRadius: '99px',
            border: '2px solid var(--border)', background: 'transparent',
            cursor: 'pointer', textDecoration: 'none',
            fontFamily: 'var(--font-body)', fontSize: '15px',
            fontWeight: '700', color: 'var(--muted)', transition: 'all 0.2s', display: 'inline-block',
          }}
            onMouseOver={e => { e.currentTarget.style.borderColor = 'var(--navy)'; e.currentTarget.style.color = 'var(--navy)'; }}
            onMouseOut={e => { e.currentTarget.style.borderColor = 'var(--border)'; e.currentTarget.style.color = 'var(--muted)'; }}
          >← Tilbake til evers.no</a>

        </div>

        <p style={{ fontFamily: 'var(--font-body)', fontSize: '13px', color: 'var(--muted)', marginTop: '36px', fontStyle: 'italic', lineHeight: '1.7' }}>
          Dette er ikke finansiell rådgivning. Gjør alltid din egen research, og vurder å snakke med en uavhengig rådgiver.
        </p>
      </div>
    </div>
  );
}

// ─── Tweaks Panel ─────────────────────────────────────────────
function TweaksPanel({ tweaks, setTweaks }) {
  const update = (key, val) => {
    const next = { ...tweaks, [key]: val };
    setTweaks(next);
    applyTweaks(next);
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits: next }, '*');
  };
  return (
    <div>
      <p style={{ fontFamily: 'var(--font-body)', fontWeight: '800', fontSize: '14px', color: 'var(--navy)', marginBottom: '16px' }}>Tweaks</p>
      <div className="tweak-row">
        <span className="tweak-label">Aksentfarge</span>
        <input type="color" value={tweaks.accentColor} onChange={e => update('accentColor', e.target.value)}
          style={{ width: '100%', height: '36px', borderRadius: '10px', border: '1px solid var(--border)', cursor: 'pointer', padding: '2px' }} />
      </div>
      <div className="tweak-row">
        <span className="tweak-label">Bakgrunn</span>
        <select className="tweak-select" value={tweaks.bgTone} onChange={e => update('bgTone', e.target.value)}>
          <option value="beige">Varm beige</option>
          <option value="slate">Kjølig slate</option>
          <option value="cream">Ren krem</option>
        </select>
      </div>
      <div className="tweak-row">
        <span className="tweak-label">Tekststørrelse</span>
        <select className="tweak-select" value={tweaks.fontSize} onChange={e => update('fontSize', e.target.value)}>
          <option value="compact">Kompakt</option>
          <option value="comfortable">Komfortabel</option>
          <option value="large">Stor</option>
        </select>
      </div>
    </div>
  );
}

// ─── App ──────────────────────────────────────────────────────
function App() {
  const saved = (() => { try { return parseInt(localStorage.getItem('fnti_step') || '0'); } catch { return 0; } })();
  const [screen, setScreen] = React.useState(saved === 99 ? 'final' : saved > 0 ? 'step' : 'hero');
  const [step, setStep] = React.useState(Math.max(1, Math.min(saved || 1, STEPS.length)));
  const [tweaks, setTweaks] = React.useState(TWEAK_DEFAULTS);
  const [tweaksOpen, setTweaksOpen] = React.useState(false);

  React.useEffect(() => { applyTweaks(tweaks); }, []);

  const persist = (s, sc) => {
    try { localStorage.setItem('fnti_step', sc === 'final' ? 99 : s); } catch {}
  };

  const goStart = () => {
    setScreen('step'); setStep(1); persist(1, 'step');
    document.getElementById('step-pill').style.opacity = 1;
  };
  const goNext = () => {
    if (step >= STEPS.length) { setScreen('final'); persist(1, 'final'); }
    else { const ns = step + 1; setStep(ns); persist(ns, 'step'); }
  };
  const goBack = () => {
    if (step === 1) { setScreen('hero'); document.getElementById('step-pill').style.opacity = 0; document.getElementById('progress-bar-fill').style.width = '0%'; persist(0, 'hero'); }
    else { const ns = step - 1; setStep(ns); persist(ns, 'step'); }
  };
  const restart = () => { setScreen('hero'); setStep(1); persist(0, 'hero'); document.getElementById('progress-bar-fill').style.width = '0%'; document.getElementById('step-pill').style.opacity = 0; };

  // Tweaks wiring
  React.useEffect(() => {
    const handler = (e) => {
      if (e.data?.type === '__activate_edit_mode') setTweaksOpen(true);
      if (e.data?.type === '__deactivate_edit_mode') setTweaksOpen(false);
    };
    window.addEventListener('message', handler);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', handler);
  }, []);

  // Render tweaks panel via portal
  React.useEffect(() => {
    const container = document.getElementById('tweaks-panel');
    if (tweaksOpen) {
      container.classList.add('visible');
      ReactDOM.render(<TweaksPanel tweaks={tweaks} setTweaks={setTweaks} />, container);
    } else {
      container.classList.remove('visible');
    }
  }, [tweaksOpen, tweaks]);

  // Screen for the current app state
  const screenEl =
    screen === 'hero'  ? <Hero onStart={goStart} /> :
    screen === 'final' ? <Final onRestart={restart} /> :
    <StepView step={step} onNext={goNext} onBack={goBack} />;

  return (
    <React.Fragment>
      {/* Page-level H1. On the hero screen the visible hero title already is the
          <h1>; on the step/summary screens (where Hero is unmounted) expose a
          visually-hidden <h1> so the page always has exactly one proper heading. */}
      {screen !== 'hero' && (
        <h1 style={{
          position: 'absolute', width: '1px', height: '1px',
          padding: 0, margin: '-1px', overflow: 'hidden',
          clip: 'rect(0, 0, 0, 0)', whiteSpace: 'nowrap', border: 0,
        }}>Fra null til investor</h1>
      )}
      {screenEl}
    </React.Fragment>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
