<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jobbsøk | Valiant Evers</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Playfair+Display:wght@400;600;700&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0d0d0f;
      --bg-card: rgba(255,255,255,0.04);
      --border: rgba(255,255,255,0.08);
      --border-hover: rgba(200,170,120,0.3);
      --text: #f0e8d8;
      --text-dim: rgba(255,255,255,0.45);
      --text-dimmer: rgba(255,255,255,0.25);
      --accent: #c8aa78;
      --accent-bg: rgba(200,170,120,0.1);
      --accent-bg-hover: rgba(200,170,120,0.2);
      --error: #e88;
      --radius: 12px;
      --radius-sm: 8px;
      --radius-pill: 20px;
    }

    body {
      background: linear-gradient(145deg, #0d0d0f 0%, #141418 40%, #1a1915 100%);
      color: var(--text);
      font-family: 'DM Sans', -apple-system, sans-serif;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
      padding: 40px 24px 80px;
    }

    /* Back link */
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--text-dimmer);
      text-decoration: none;
      font-size: 13px;
      margin-bottom: 32px;
      transition: color 0.2s;
    }
    .back-link:hover { color: var(--accent); }

    /* Header */
    .header { margin-bottom: 36px; }
    .header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 4px;
    }
    .header p {
      font-size: 14px;
      color: var(--text-dimmer);
      letter-spacing: 0.5px;
    }

    /* Search bar */
    .search-bar {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }
    .search-bar input {
      flex: 1;
      padding: 13px 18px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 14px;
      font-family: 'DM Sans', sans-serif;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-bar input::placeholder { color: var(--text-dimmer); }
    .search-bar input:focus { border-color: var(--border-hover); }
    .search-bar button {
      padding: 13px 24px;
      background: var(--accent-bg);
      border: 1px solid var(--border-hover);
      border-radius: var(--radius);
      color: var(--accent);
      font-size: 14px;
      font-family: 'DM Sans', sans-serif;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }
    .search-bar button:hover { background: var(--accent-bg-hover); }
    .search-bar button:disabled { opacity: 0.5; cursor: wait; }

    /* Presets */
    .presets {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 32px;
    }
    .preset-btn {
      padding: 7px 14px;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: var(--radius-pill);
      color: var(--text-dim);
      font-size: 12px;
      font-family: 'DM Sans', sans-serif;
      cursor: pointer;
      transition: all 0.2s;
    }
    .preset-btn:hover {
      background: var(--accent-bg);
      border-color: var(--border-hover);
      color: var(--accent);
    }
    .preset-btn:disabled { cursor: wait; }

    /* Job card */
    .job-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 22px;
      margin-bottom: 12px;
      cursor: pointer;
      transition: all 0.2s;
      animation: fadeUp 0.4s ease both;
    }
    .job-card:hover {
      background: rgba(255,255,255,0.07);
      border-color: var(--border-hover);
    }
    .job-card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }
    .job-title {
      font-weight: 600;
      font-size: 15px;
      color: var(--text);
      margin-bottom: 4px;
    }
    .job-meta {
      font-size: 13px;
      color: var(--text-dim);
    }
    .job-link {
      font-size: 12px;
      color: var(--accent);
      text-decoration: none;
      padding: 4px 10px;
      border: 1px solid var(--border-hover);
      border-radius: 6px;
      white-space: nowrap;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    .job-link:hover { background: rgba(200,170,120,0.15); }
    .job-details {
      display: none;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid rgba(255,255,255,0.06);
    }
    .job-card.open .job-details { display: block; }
    .job-desc {
      font-size: 13px;
      color: rgba(255,255,255,0.6);
      line-height: 1.6;
      white-space: pre-wrap;
    }
    .job-relevance {
      margin-top: 8px;
      padding: 8px 12px;
      background: rgba(200,170,120,0.08);
      border-radius: var(--radius-sm);
      font-size: 12px;
      color: var(--accent);
      line-height: 1.5;
    }

    /* States */
    .loading-state, .empty-state, .error-state {
      text-align: center;
      padding: 48px 0;
    }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid rgba(200,170,120,0.15);
      border-top: 3px solid var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    .spinner-inline {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2.5px solid rgba(255,255,255,0.2);
      border-top: 2.5px solid #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    .loading-text { font-size: 14px; color: var(--text-dim); }
    .loading-sub {
      font-size: 12px;
      color: var(--text-dimmer);
      margin-top: 6px;
      animation: pulse 2s ease infinite;
    }
    .empty-icon {
      font-family: 'Playfair Display', serif;
      font-size: 44px;
      margin-bottom: 16px;
      opacity: 0.15;
    }
    .empty-text { font-size: 14px; color: var(--text-dimmer); }
    .empty-sub { font-size: 12px; color: rgba(255,255,255,0.12); margin-top: 8px; }
    .error-state {
      padding: 16px 20px;
      background: rgba(200,60,60,0.1);
      border: 1px solid rgba(200,60,60,0.2);
      border-radius: var(--radius);
      font-size: 13px;
      color: var(--error);
      text-align: left;
    }
    .results-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      font-size: 13px;
      color: var(--text-dimmer);
    }
    .results-count { font-size: 11px; color: rgba(255,255,255,0.2); }
    .results-note {
      margin-top: 20px;
      padding: 14px 18px;
      background: rgba(200,170,120,0.05);
      border: 1px solid rgba(200,170,120,0.1);
      border-radius: var(--radius);
      font-size: 12px;
      color: var(--text-dimmer);
      line-height: 1.5;
    }
    .profile-tag {
      margin-top: 40px;
      padding: 14px 18px;
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: var(--radius);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .profile-label { font-size: 12px; color: var(--text-dimmer); margin-bottom: 2px; }
    .profile-name { font-size: 13px; color: var(--text-dim); }
    .profile-roles { font-size: 11px; color: rgba(255,255,255,0.15); text-align: right; }

    /* Auth overlay */
    .auth-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.85);
      display: flex; align-items: center; justify-content: center;
      z-index: 100;
      backdrop-filter: blur(8px);
    }
    .auth-box {
      background: #1a1a1e;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 36px;
      max-width: 400px;
      width: 90%;
      text-align: center;
    }
    .auth-box h2 {
      font-family: 'Playfair Display', serif;
      font-size: 22px;
      margin-bottom: 8px;
    }
    .auth-box p {
      font-size: 13px;
      color: var(--text-dim);
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .auth-box input {
      width: 100%;
      padding: 12px 16px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-size: 14px;
      font-family: 'DM Sans', sans-serif;
      outline: none;
      margin-bottom: 12px;
    }
    .auth-box input:focus { border-color: var(--border-hover); }
    .auth-box button {
      width: 100%;
      padding: 12px;
      background: var(--accent-bg-hover);
      border: 1px solid var(--border-hover);
      border-radius: var(--radius-sm);
      color: var(--accent);
      font-size: 14px;
      font-weight: 600;
      font-family: 'DM Sans', sans-serif;
      cursor: pointer;
      transition: all 0.2s;
    }
    .auth-box button:hover { background: rgba(200,170,120,0.3); }
    .auth-hint {
      font-size: 11px;
      color: rgba(255,255,255,0.15);
      margin-top: 16px;
    }

    .hidden { display: none !important; }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }

    @media (max-width: 500px) {
      .container { padding: 24px 16px 60px; }
      .header h1 { font-size: 24px; }
      .search-bar { flex-direction: column; }
      .search-bar button { justify-content: center; }
      .profile-tag { flex-direction: column; gap: 8px; }
      .profile-roles { text-align: left; }
    }
  </style>
</head>
<body>

  <!-- Auth gate: simple passphrase so only you can use it -->
  <div class="auth-overlay" id="authOverlay">
    <div class="auth-box">
      <h2>🔒</h2>
      <p>Dette verktøyet er privat.<br>Skriv inn passordet for å fortsette.</p>
      <input type="password" id="authInput" placeholder="Passord" autofocus>
      <button onclick="authenticate()">Logg inn</button>
      <div class="auth-hint">Kontakt Valiant for tilgang</div>
    </div>
  </div>

  <div class="container" id="app" style="opacity: 0;">

    <a href="https://evers.no" class="back-link">← evers.no</a>

    <div class="header">
      <h1>Jobbsøk</h1>
      <p>AI-drevet stillingssøk tilpasset din profil</p>
    </div>

    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Søk etter stillinger..." />
      <button id="searchBtn" onclick="runSearch()">Søk</button>
    </div>

    <div class="presets" id="presets"></div>

    <div id="content"></div>

    <div class="profile-tag">
      <div>
        <div class="profile-label">Profil</div>
        <div class="profile-name">Valiant Evers · MSc Finance, BI</div>
      </div>
      <div class="profile-roles">Client-facing roles<br>Oslo · Paris</div>
    </div>
  </div>

<script>
// ============================================
// CONFIG: Change this to your Cloudflare Worker URL
// ============================================
const WORKER_URL = "https://jobsearch-proxy.valiantevers1809.workers.dev";

// Simple auth passphrase (change this!)
// This is NOT security — it just prevents random visitors from burning your API credits.
// The real security is the CORS + API key in the Cloudflare Worker.
const PASSPHRASE = "valiant2026";

const PRESETS = [
  { label: "Wealth Management Oslo", query: "wealth management finansrådgiver Oslo 2026 ledig stilling" },
  { label: "Graduate Finance Norden", query: "graduate programme finance Nordic 2026 apply" },
  { label: "Fund Sales / Distribution", query: "fund sales distribution Nordic Oslo stilling 2026" },
  { label: "Capital Markets Sales", query: "capital markets sales trading Oslo Nordic junior 2026" },
  { label: "Private Banking Oslo", query: "private banking rådgiver Oslo ledig stilling 2026" },
  { label: "Paris Finance Internship", query: "stage finance structured products Paris Nordic desk 2026" },
  { label: "FINN.no Finans", query: "site:finn.no finans rådgiver Oslo ledig stilling" },
  { label: "Karrierestart Finans", query: "site:karrierestart.no finance wealth management Oslo" },
];

const SYSTEM_PROMPT = `You are a job search assistant for Valiant Evers. He is a finance master's student at BI Norwegian Business School (graduating June 2026), Norwegian-Belgian, based in Oslo, open to Paris. He targets client-facing roles: wealth management, private banking, fund sales/distribution, capital markets sales, corporate access, graduate programmes in finance.

Your task: Search the web for the given query and return structured job listings. Return ONLY valid JSON, no markdown, no backticks, no preamble. The JSON must be an array of objects with these fields:
- "title": job title
- "company": company name
- "location": city/country
- "url": application URL if found
- "description": brief description (2-3 sentences max)
- "relevance": one sentence on why this fits Valiant's profile

Return up to 10 results. Only include real, currently open positions. If nothing relevant is found, return an empty array [].
IMPORTANT: Only return the JSON array. No other text.`;

let searchCount = 0;
let isLoading = false;

// Auth
function authenticate() {
  const input = document.getElementById("authInput");
  if (input.value === PASSPHRASE) {
    document.getElementById("authOverlay").classList.add("hidden");
    document.getElementById("app").style.opacity = "1";
    document.getElementById("searchInput").focus();
    sessionStorage.setItem("jobsearch_auth", "true");
  } else {
    input.style.borderColor = "rgba(200,60,60,0.5)";
    input.value = "";
    input.placeholder = "Feil passord";
    setTimeout(() => {
      input.style.borderColor = "";
      input.placeholder = "Passord";
    }, 1500);
  }
}

// Check session
if (sessionStorage.getItem("jobsearch_auth") === "true") {
  document.getElementById("authOverlay").classList.add("hidden");
  document.getElementById("app").style.opacity = "1";
}

// Enter key on auth
document.getElementById("authInput").addEventListener("keydown", e => {
  if (e.key === "Enter") authenticate();
});

// Render presets
const presetsContainer = document.getElementById("presets");
PRESETS.forEach(p => {
  const btn = document.createElement("button");
  btn.className = "preset-btn";
  btn.textContent = p.label;
  btn.onclick = () => {
    document.getElementById("searchInput").value = p.query;
    runSearch(p.query);
  };
  presetsContainer.appendChild(btn);
});

// Enter key on search
document.getElementById("searchInput").addEventListener("keydown", e => {
  if (e.key === "Enter") runSearch();
});

async function runSearch(overrideQuery) {
  const input = document.getElementById("searchInput");
  const query = overrideQuery || input.value.trim();
  if (!query || isLoading) return;

  isLoading = true;
  const content = document.getElementById("content");
  const btn = document.getElementById("searchBtn");

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner-inline"></span>';
  document.querySelectorAll(".preset-btn").forEach(b => b.disabled = true);

  content.innerHTML = `
    <div class="loading-state">
      <div class="spinner"></div>
      <div class="loading-text">Søker med AI-websøk...</div>
      <div class="loading-sub">Dette kan ta 10-20 sekunder</div>
    </div>
  `;

  try {
    const response = await fetch(WORKER_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        system: SYSTEM_PROMPT,
        messages: [{ role: "user", content: `Search for jobs matching: ${query}` }],
      }),
    });

    if (!response.ok) {
      const errData = await response.json().catch(() => ({}));
      const msg = errData.error?.message || errData.message || `HTTP ${response.status}`;
      throw new Error(msg);
    }

    const data = await response.json();

    // Extract text
    const textBlocks = (data.content || [])
      .filter(b => b.type === "text")
      .map(b => b.text)
      .join("\n");

    if (!textBlocks.trim()) {
      renderResults([]);
      return;
    }

    // Parse JSON
    let cleaned = textBlocks.trim().replace(/```json\s*/g, "").replace(/```\s*/g, "").trim();
    const start = cleaned.indexOf("[");
    const end = cleaned.lastIndexOf("]");
    if (start !== -1 && end !== -1) cleaned = cleaned.substring(start, end + 1);

    try {
      const jobs = JSON.parse(cleaned);
      renderResults(Array.isArray(jobs) ? jobs : []);
    } catch {
      renderResults([{
        title: "Søkeresultater (ustrukturert)",
        company: "Se beskrivelse",
        description: textBlocks,
        relevance: "Kunne ikke parse strukturerte resultater.",
      }]);
    }
  } catch (err) {
    content.innerHTML = `<div class="error-state">Feil: ${err.message}</div>`;
  } finally {
    isLoading = false;
    btn.disabled = false;
    btn.textContent = "Søk";
    document.querySelectorAll(".preset-btn").forEach(b => b.disabled = false);
  }
}

function renderResults(jobs) {
  searchCount++;
  const content = document.getElementById("content");

  if (jobs.length === 0) {
    content.innerHTML = `
      <div class="results-header">
        <span>Ingen relevante treff</span>
        <span class="results-count">Søk #${searchCount}</span>
      </div>
      <div class="empty-state" style="padding: 36px 0;">
        <div class="empty-text">Prøv et annet søkeord eller en av snarvei-knappene over.</div>
      </div>
    `;
    return;
  }

  let html = `
    <div class="results-header">
      <span>${jobs.length} treff</span>
      <span class="results-count">Søk #${searchCount}</span>
    </div>
  `;

  jobs.forEach((job, i) => {
    html += `
      <div class="job-card" style="animation-delay: ${i * 60}ms" onclick="this.classList.toggle('open')">
        <div class="job-card-header">
          <div>
            <div class="job-title">${esc(job.title || "Ukjent stilling")}</div>
            <div class="job-meta">${esc(job.company || "")}${job.location ? " · " + esc(job.location) : ""}</div>
          </div>
          ${job.url ? `<a href="${esc(job.url)}" target="_blank" rel="noopener" class="job-link" onclick="event.stopPropagation()">Åpne →</a>` : ""}
        </div>
        <div class="job-details">
          ${job.description ? `<div class="job-desc">${esc(job.description)}</div>` : ""}
          ${job.relevance ? `<div class="job-relevance"><strong>Relevans:</strong> ${esc(job.relevance)}</div>` : ""}
        </div>
      </div>
    `;
  });

  html += `<div class="results-note">Klikk på et kort for å se beskrivelse og relevans. Trykk "Åpne" for å gå direkte til stillingen.</div>`;
  content.innerHTML = html;
}

function esc(str) {
  const d = document.createElement("div");
  d.textContent = str;
  return d.innerHTML;
}
</script>
</body>
</html>
