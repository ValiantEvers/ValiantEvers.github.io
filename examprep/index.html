<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GRA6546 — Exam Prep Hub</title>
  <meta name="description" content="Exam preparation hub for GRA6546 Financial Institutions and Crises — BI Norwegian Business School." />

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="alternate icon" type="image/png" href="favicon.png" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,700;0,900;1,400;1,700&family=Barlow:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&display=swap" rel="stylesheet" />

  <!-- Styles -->
  <link rel="stylesheet" href="css/main.css" />

  <!-- React + Babel -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <a href="#main-content" class="visually-hidden" style="position:absolute;top:8px;left:8px;z-index:999;background:var(--paper);padding:8px 16px;border:2px solid var(--ink);">
    Skip to main content
  </a>

  <div id="root"></div>

  <!-- Shared utilities (plain JS, no Babel needed) -->
  <script src="js/utils.js"></script>

  <!-- React components (Babel JSX, loaded in dependency order) -->
  <script type="text/babel" src="js/TopicsModule.jsx" data-presets="react"></script>
  <script type="text/babel" src="js/GlossaryModule.jsx" data-presets="react"></script>
  <script type="text/babel" src="js/TimelineModule.jsx" data-presets="react"></script>
  <script type="text/babel" src="js/FlashcardsModule.jsx" data-presets="react"></script>
  <script type="text/babel" src="js/QuizModule.jsx" data-presets="react"></script>
  <script type="text/babel" src="js/ExamsModule.jsx" data-presets="react"></script>
  <script type="text/babel" src="js/MockExamModule.jsx" data-presets="react"></script>
  <script type="text/babel" src="js/SearchPalette.jsx" data-presets="react"></script>
  <script type="text/babel" src="js/App.jsx" data-presets="react"></script>
</body>
</html>
