<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Valiant Evers &middot; lesesalen</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root{--bg:#fafaf9;--text:#0a0a0a;--muted:#737373;--accent:#0070ed;--accent2:#3b82f6;
--accent3:#e7e5e4;--card-bg:#ffffff;--ease-out:cubic-bezier(0.23,1,0.32,1)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);line-height:1.6;display:flex;flex-direction:column;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:20px 26px}
.logo{font-family:Georgia,serif;font-weight:800;font-size:1.5rem;color:var(--accent);text-decoration:none}
.topbar span{font-family:ui-monospace,monospace;font-size:.72rem;color:var(--muted);letter-spacing:1px}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:var(--card-bg);border:1px solid var(--accent3);border-radius:20px;
box-shadow:0 1px 2px rgba(0,0,0,.04);padding:42px 40px;max-width:520px;width:100%;
opacity:0;transform:translateY(8px);animation:reveal .2s var(--ease-out) forwards}
@keyframes reveal{to{opacity:1;transform:none}}
.section-label{display:inline-block;font-family:ui-monospace,monospace;font-size:.72rem;
text-transform:uppercase;letter-spacing:3px;font-weight:600;color:var(--accent);margin-bottom:12px}
h1{font-family:Georgia,serif;font-weight:600;font-size:1.9rem;letter-spacing:-.01em;margin-bottom:10px}
p.lead{color:var(--muted);font-size:.98rem;margin-bottom:22px}
.pwrow{display:flex;gap:10px}
input[type=password]{flex:1;font:inherit;font-size:1rem;padding:.75rem 1rem;
border:1.5px solid var(--accent3);border-radius:12px;background:var(--bg);color:var(--text);
outline:none;transition:border-color 160ms ease}
input[type=password]:focus{border-color:var(--accent2)}
.btn{font:inherit;font-weight:600;padding:.75rem 1.5rem;border-radius:12px;border:none;
background:var(--accent);color:#fff;cursor:pointer}
.btn:disabled{opacity:.6;cursor:default}
.err{color:#b91c1c;font-size:.9rem;min-height:1.4em;margin-top:10px}
footer{padding:18px;text-align:center;font-family:ui-monospace,monospace;font-size:.64rem;
letter-spacing:2px;text-transform:uppercase;color:var(--muted)}
</style>
</head>
<body>
<div class="topbar"><a class="logo" href="https://evers.no/">V.</a><span>IKKE-OFFENTLIG SIDE</span></div>
<main>
  <div class="card">
    <span class="section-label">Kryptert innhold</span>
    <h1>Lesesalen</h1>
    <p class="lead">Denne siden er ulistet, og innholdet er kryptert i selve siden.
    Skriv inn passordet, s&aring; l&aring;ses det opp lokalt i nettleseren din.</p>
    <form class="pwrow" id="form">
      <input type="password" id="pw" placeholder="Passord" autocomplete="off" autofocus aria-label="Passord">
      <button class="btn" type="submit">L&aring;s opp</button>
    </form>
    <div class="err" id="err"></div>
  </div>
</main>
<footer>PRIVAT &middot; VALIANT EVERS &middot; EVERS.NO</footer>

<script>
const B = JSON.parse(document.getElementById('blob').textContent);
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function deriveKey(pw){
  const norm = pw.trim().toLowerCase().normalize('NFC');
  const mat = await crypto.subtle.importKey('raw', new TextEncoder().encode(norm), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    {name:'PBKDF2', salt: b64(B.salt), iterations: B.iter, hash:'SHA-256'},
    mat, {name:'AES-GCM', length:256}, true, ['decrypt']);
}
async function dec(key, p){
  const buf = await crypto.subtle.decrypt({name:'AES-GCM', iv: b64(p.iv)}, key, b64(p.ct));
  return new TextDecoder().decode(buf);
}
async function aapne(key){
  const html = await dec(key, B.app);
  try{ const raw = await crypto.subtle.exportKey('raw', key);
       sessionStorage.setItem('ob_k', btoa(String.fromCharCode(...new Uint8Array(raw)))); }catch(e){}
  document.open(); document.write(html); document.close();
}
document.getElementById('form').addEventListener('submit', async e => {
  e.preventDefault();
  const err = document.getElementById('err');
  const btn = e.target.querySelector('button');
  err.textContent = ''; btn.disabled = true;
  try{
    const key = await deriveKey(document.getElementById('pw').value);
    await dec(key, B.canary);
    await aapne(key);
  }catch(ex){ err.textContent = 'Feil passord, pr\u00f8v igjen.'; btn.disabled = false; }
});
// Samme fane, samme \u00f8kt: l\u00e5s opp automatisk med n\u00f8kkelen (aldri passordet).
(async () => {
  const raw = sessionStorage.getItem('ob_k');
  if (!raw) return;
  try{
    const key = await crypto.subtle.importKey('raw', b64(raw), {name:'AES-GCM'}, true, ['decrypt']);
    await dec(key, B.canary);
    await aapne(key);
  }catch(e){ sessionStorage.removeItem('ob_k'); }
})();
</script>
