<style>
/* Portside for en ULISTET, passordbeskyttet intern side (kopi av hub-malen 28.10.2026).
   Payloaden (PBKDF2-SHA256 + AES-GCM) settes inn av byggeskriptet; normaliseringen av
   passordet MÅ speile det. Rediger aldri den bakte fila for hånd. Siden vises i en iframe
   (srcdoc) etter opplåsing. Null eksterne forespørsler; fonter selvhostes av siten.
   Passordet finnes ALDRI i denne fila. */
@font-face{font-family:'Fraunces';font-style:normal;font-weight:100 900;font-display:swap;src:url('/fonts/fraunces-latin-full-normal.woff2') format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Hanken Grotesk';font-style:normal;font-weight:100 900;font-display:swap;src:url('/fonts/hanken-grotesk-latin-wght-normal.woff2') format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}

/* «Prospekt» (2026-10-29): the same paper, ink and type as the page behind the lock. */
:root{
  --serif:"Fraunces",Georgia,"Times New Roman",serif;
  --sans:"Hanken Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,monospace;
  --paper:#f3eee4;--ink:#191714;--soft:#5b544a;--hair:#ddd4c5;--rule:#c4b8a5;
  --blue:#123f86;--err:#94480f;--ease:cubic-bezier(.2,.7,.2,1);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#101215;--ink:#ede6d9;--soft:#aaa192;--hair:#2a2f36;--rule:#3a3f47;
  --blue:#93b4ff;--err:#e6a465;color-scheme:dark;
}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font:400 15px/1.6 var(--sans);
  display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:22px clamp(20px,4vw,56px);
  border-bottom:1px solid var(--hair)}
.logo{font:500 17px/1 var(--serif);color:var(--ink);text-decoration:none;letter-spacing:-.01em}
.topbar span{font:500 11px/1 var(--mono);letter-spacing:.16em;color:var(--soft)}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:48px clamp(20px,4vw,56px)}
.card{width:100%;max-width:440px;opacity:0;transform:translateY(10px);
  animation:reveal .6s var(--ease) .05s forwards}
@keyframes reveal{to{opacity:1;transform:none}}
.section-label{display:block;font:500 11px/1.4 var(--mono);letter-spacing:.16em;text-transform:uppercase;
  color:var(--soft);margin-bottom:14px}
h1{font:300 clamp(88px,14vw,128px)/.85 var(--serif);font-variation-settings:"opsz" 144;
  letter-spacing:-.04em;margin:0 0 26px -.04em;padding-bottom:26px;border-bottom:3px double var(--rule)}
p.lead{color:var(--soft);font-size:14.5px;margin-bottom:30px;max-width:38ch}
.pwrow{display:flex;gap:12px;align-items:stretch}
input[type=password]{flex:1;min-width:0;font:400 17px/1 var(--sans);padding:14px 2px;color:var(--ink);
  background:transparent;border:0;border-bottom:1px solid var(--ink);border-radius:0;outline:none;
  letter-spacing:.12em;transition:border-color .2s ease}
input[type=password]:focus{border-bottom:2px solid var(--blue);padding-bottom:13px}
.btn{font:500 14px/1 var(--sans);padding:0 22px;border:1px solid var(--ink);border-radius:999px;
  background:var(--ink);color:var(--paper);cursor:pointer;transition:transform .16s var(--ease)}
.btn:hover{background:transparent;color:var(--ink)}
.btn:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.55;cursor:wait}
.err{color:var(--err);font-size:13.5px;margin-top:12px;min-height:1.3em}
.remember{display:flex;align-items:center;gap:10px;margin-top:18px;font-size:13px;color:var(--soft);
  cursor:pointer;user-select:none}
.remember input{accent-color:var(--ink);width:15px;height:15px}
footer{text-align:center;padding:22px;font:400 11px/1.4 var(--mono);letter-spacing:.06em;color:var(--soft);
  border-top:1px solid var(--hair)}
#viewer{position:fixed;inset:0;background:var(--paper);display:flex;flex-direction:column;z-index:100}
.vbar{display:flex;align-items:center;gap:14px;padding:6px clamp(12px,3vw,24px);background:var(--ink);
  color:var(--paper)}
.vback{font:500 12px/1 var(--sans);color:var(--paper);background:transparent;
  border:1px solid color-mix(in srgb,var(--paper) 35%,transparent);border-radius:999px;padding:6px 12px;
  cursor:pointer}
.vback:hover{border-color:var(--paper)}
.vback:active{transform:scale(.97)}
.vtitle{font:400 11px/1 var(--mono);letter-spacing:.08em;color:color-mix(in srgb,var(--paper) 60%,transparent)}
.vframe{flex:1;border:0;width:100%;background:var(--paper)}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
</style>
</head>
<body>
<div class="topbar"><a class="logo" href="/">Valiant Evers</a><span>PRIVAT</span></div>
<main>
  <div class="card" id="lock">
    <span class="section-label">Privat</span>
    <h1>hq</h1>
    <p class="lead">Passordbeskyttet side. Innholdet ligger kryptert i selve
    fila og låses opp lokalt i nettleseren — ingenting sendes noe sted.</p>
    <form id="form">
      <div class="pwrow">
        <input type="password" id="pw" autocomplete="current-password" autofocus aria-label="Passord">
        <button class="btn" type="submit">Lås opp</button>
      </div>
      <label class="remember"><input type="checkbox" id="rem"> Husk på denne enheten
        (til du trykker Lås)</label>
      <div class="err" id="err"></div>
    </form>
  </div>
</main>
<footer>evers.no · kryptert i ro og i bruk · ingen eksterne kall</footer>

<script>
"use strict";
const B = JSON.parse(document.getElementById('blob').textContent);
const $ = id => document.getElementById(id);
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
let KEY = null;

// Normalisering — MÅ speile byggeskriptet: trim → lowercase → NFC →
// apostrof-varianter (iOS «smart punctuation» gjør ' om til ’) → '.
function norm(pw){
  return pw.trim().toLowerCase().normalize('NFC').replace(/[‘’‛`´]/g, "'");
}
async function deriveKey(pw){
  const mat = await crypto.subtle.importKey('raw', new TextEncoder().encode(norm(pw)), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    {name:'PBKDF2', salt: b64(B.salt), iterations: B.iter, hash:'SHA-256'},
    mat, {name:'AES-GCM', length:256}, true, ['decrypt']);
}
async function dec(key, p){
  const buf = await crypto.subtle.decrypt({name:'AES-GCM', iv: b64(p.iv)}, key, b64(p.ct));
  return new TextDecoder().decode(buf);
}
async function visDash(key){
  const html = await dec(key, B.dash);
  const o = document.createElement('div'); o.id = 'viewer';
  const bar = document.createElement('div'); bar.className = 'vbar';
  const laas = document.createElement('button'); laas.type = 'button';
  laas.className = 'vback'; laas.textContent = 'Lås';
  const t = document.createElement('span'); t.className = 'vtitle';
  t.textContent = 'hq · dekryptert lokalt';
  bar.appendChild(laas); bar.appendChild(t);
  const fr = document.createElement('iframe'); fr.className = 'vframe';
  fr.setAttribute('title', 'hq'); fr.srcdoc = html;
  o.appendChild(bar); o.appendChild(fr);
  document.body.appendChild(o); document.body.style.overflow = 'hidden';
  laas.addEventListener('click', () => {
    try{ sessionStorage.removeItem('hq_k'); localStorage.removeItem('hq_k'); }catch(e){}
    location.reload();
  });
}
async function tryUnlock(pw){
  const key = await deriveKey(pw);
  await dec(key, B.canary);            // kaster ved feil passord
  KEY = key;
  // Nøkkelen (aldri passordet) caches: sessionStorage per fane, eller
  // localStorage hvis «husk på denne enheten» er valgt — Lås tømmer begge.
  try{ const raw = await crypto.subtle.exportKey('raw', key);
       const b = btoa(String.fromCharCode(...new Uint8Array(raw)));
       ($('rem').checked ? localStorage : sessionStorage).setItem('hq_k', b); }catch(e){}
  await visDash(key);
}
$('form').addEventListener('submit', async e => {
  e.preventDefault(); $('err').textContent = '';
  const btn = e.target.querySelector('button'); btn.disabled = true;
  try{ await tryUnlock($('pw').value); }
  catch(err){ $('err').textContent = 'Feil passord, prøv igjen.'; }
  btn.disabled = false;
});
// Gjenopprett (nøkkel, aldri passord): fane-cache først, så husket enhet
(async () => {
  let raw = null;
  try{ raw = sessionStorage.getItem('hq_k') || localStorage.getItem('hq_k'); }catch(e){}
  if (!raw) return;
  try{
    const key = await crypto.subtle.importKey('raw', b64(raw), {name:'AES-GCM'}, true, ['decrypt']);
    await dec(key, B.canary);
    KEY = key; await visDash(key);
  }catch(e){ try{ sessionStorage.removeItem('hq_k'); localStorage.removeItem('hq_k'); }catch(_){} }
})();
</script>
