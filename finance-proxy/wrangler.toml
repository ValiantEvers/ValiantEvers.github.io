name = "finance-proxy"
main = "src/index.js"
compatibility_date = "2026-01-01"
workers_dev = true

# account_id utelates med vilje — wrangler bruker den innloggede kontoen.
# Da committes ingen kontospesifikke verdier til det offentlige evers.no-repoet.

# Web-vitals RUM (P-9): Analytics Engine-datasett. Opprettes automatisk ved første write.
[[analytics_engine_datasets]]
binding = "VITALS"
dataset = "evers_web_vitals"

# Besøksmåler (2026-10-03): POST /hit → eget datasett. Leses av GET /stats, som krever
# secrets STATS_KEY, CF_ACCOUNT_ID og CF_API_TOKEN (wrangler secret put …) — se README.
[[analytics_engine_datasets]]
binding = "HITS"
dataset = "evers_hits"
