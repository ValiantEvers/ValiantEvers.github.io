<style>
@font-face{font-family:'Outfit';font-style:normal;font-weight:100 900;font-display:swap;src:url('/fonts/outfit-latin-wght-normal.woff2') format('woff2')}
@font-face{font-family:'Newsreader';font-style:normal;font-weight:200 800;font-display:swap;src:url('/fonts/newsreader-latin-standard-normal.woff2') format('woff2')}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:100 800;font-display:swap;src:url('/fonts/jetbrains-mono-latin-wght-normal.woff2') format('woff2')}

:root{
  --bg:#00101e; --bg2:#06182b; --text:#eaf6fb; --muted:rgba(234,246,251,.62);
  --know:#4ec3e3; --know2:#c4e9ee;   /* Kunnskap */
  --conf:#c98cd4;                     /* Selvtillit */
  --risk:#ff9e7a;                     /* Risiko */
  --good:#4fd1b0; --slate:#88a0b0;
  --line:rgba(196,233,238,.12);
  --serif:'Newsreader',Georgia,serif;
  --sans:'Outfit',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --maxw:760px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--text);line-height:1.6;overflow-x:hidden;-webkit-font-smoothing:antialiased}
h1,h2,h3{line-height:1.06;letter-spacing:-.02em;text-wrap:balance}

/* ---- backdrop + particle canvas ---- */
.backdrop{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(125% 85% at 50% -8%,#06223b 0%,#00101e 52%,#00060f 100%)}
.bgfield{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0;transition:opacity 1.4s ease}
.bgfield.on{opacity:.82}
body::after{content:'';position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.025;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");background-size:200px}

main{position:relative;z-index:2}

/* ---- left progress rail (replaces the old top-left pill) ---- */
.rail{position:fixed;left:max(18px,2.4vw);top:50%;transform:translateY(-50%);z-index:40;
  display:flex;flex-direction:column;align-items:center;gap:0;pointer-events:none}
.rail__track{position:relative;width:2px;height:46vh;background:var(--line);border-radius:2px;overflow:hidden}
.rail__fill{position:absolute;left:0;top:0;width:100%;height:0;background:linear-gradient(180deg,var(--know),var(--conf));border-radius:2px}
.rail__marks{position:absolute;inset:0}
.rail__mark{position:absolute;left:50%;width:7px;height:7px;border-radius:50%;background:var(--bg2);border:1.5px solid var(--line);transform:translate(-50%,-50%);transition:background .3s,border-color .3s,box-shadow .3s}
.rail__mark.on{background:var(--know);border-color:var(--know);box-shadow:0 0 0 4px rgba(78,195,227,.15)}
.rail__lbl{position:absolute;left:18px;white-space:nowrap;font-family:var(--mono);font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);transform:translateY(-50%);opacity:0;transition:opacity .3s}
.rail__mark.on + .rail__lbl{opacity:1;color:var(--know2)}
@media (max-width:760px){ .rail{display:none} }

/* ---- hero ---- */
.hero{position:relative;z-index:2;min-height:100svh;display:flex;flex-direction:column;justify-content:center;padding:6rem clamp(1.4rem,6vw,5rem) 4rem;max-width:1100px;margin:0 auto}
.hero::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:100vw;height:100%;z-index:-1;pointer-events:none;background:radial-gradient(130% 92% at 37% 42%,rgba(0,10,18,.93) 0%,rgba(0,10,18,.7) 28%,rgba(0,10,18,.32) 50%,rgba(0,10,18,0) 66%)}
.hero .kicker{font-family:var(--mono);font-size:.72rem;letter-spacing:.34em;text-transform:uppercase;color:var(--know);margin-bottom:1.6rem;text-shadow:0 1px 12px rgba(0,8,16,.85)}
.hero h1{font-family:var(--serif);font-weight:300;font-size:clamp(2.6rem,7.5vw,5.4rem);max-width:16ch;margin-bottom:1.4rem;
  background:linear-gradient(180deg,#fff,#e3eef3);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 2px 24px rgba(0,8,16,.9))}
.hero p{font-size:clamp(1.05rem,2.2vw,1.3rem);color:rgba(234,246,251,.84);max-width:42ch;text-shadow:0 1px 16px rgba(0,8,16,.92)}
.hero .down{position:absolute;left:50%;bottom:2.6rem;transform:translateX(-50%);font-family:var(--mono);font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:.7rem}
.hero .down i{width:18px;height:18px;border-right:1.5px solid var(--know);border-bottom:1.5px solid var(--know);transform:rotate(45deg);animation:bob 1.8s ease-in-out infinite}
@keyframes bob{0%,100%{transform:rotate(45deg) translate(0,0)}50%{transform:rotate(45deg) translate(3px,3px)}}

/* ---- lead-in editorial block ---- */
.lead{position:relative;max-width:var(--maxw);margin:0 auto;padding:8rem clamp(1.4rem,6vw,2rem)}
.lead::before{content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:138%;height:150%;z-index:-1;pointer-events:none;background:radial-gradient(closest-side,rgba(0,9,17,.74),rgba(0,9,17,0))}
.lead .eyebrow{font-family:var(--mono);font-size:.7rem;letter-spacing:.22em;text-transform:uppercase;color:var(--conf);margin-bottom:1rem;text-shadow:0 1px 12px rgba(0,8,16,.8)}
.lead h2{font-family:var(--serif);font-weight:400;font-size:clamp(1.9rem,4.4vw,2.9rem);margin-bottom:1.2rem;text-shadow:0 1px 20px rgba(0,8,16,.85)}
.lead p{font-size:clamp(1.05rem,2.2vw,1.18rem);color:#dbeaf1;text-shadow:0 1px 14px rgba(0,8,16,.85)}

/* ================= SCROLLY (sticky + scrubbed) ================= */
.scrolly{position:relative;z-index:2}
.scrolly__sticky{position:sticky;top:0;height:100svh;display:grid;grid-template-rows:1fr auto;align-items:center;overflow:hidden}
.scrolly__sticky::before{content:'';position:absolute;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(58% 48% at 50% 42%,rgba(0,7,14,.66),transparent 72%)}
.scrolly__spacer{height:420vh}            /* drives scroll length; progress measured from real geometry */

.stage{width:100%;max-width:1000px;margin:0 auto;padding:0 clamp(1.2rem,5vw,2rem)}
.med-eyebrow{font-family:var(--mono);font-size:.68rem;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);text-align:center;margin-bottom:.4rem}
.med-svg{display:block;width:100%;height:auto}
.med-svg .pathline{fill:none;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
.med-svg .nodebox{transition:opacity .25s}
.med-svg text{font-family:var(--sans)}
.med-svg .coef{font-family:var(--mono);font-weight:600}

/* caption block, cross-fades by scroll progress, no card */
.scrolly__caption{position:relative;min-height:7.5rem;max-width:680px;margin:0 auto 5vh;padding:0 clamp(1.2rem,5vw,2rem);text-align:center}
.cap{position:absolute;left:50%;top:0;width:min(680px,92vw);padding:0 clamp(1.2rem,5vw,2rem);opacity:0;transform:translate(-50%,10px);transition:opacity .5s ease,transform .5s ease;pointer-events:none;text-shadow:0 1px 18px rgba(0,8,16,.94),0 1px 3px rgba(0,8,16,.8)}
.cap.on{opacity:1;transform:translate(-50%,0)}
.cap b{color:var(--text);font-weight:600}
.cap .big{font-family:var(--serif);font-size:clamp(1.25rem,3vw,1.7rem);font-weight:400;color:var(--text);display:block;margin-bottom:.5rem}
.cap small{display:block;margin-top:.6rem;font-family:var(--mono);font-size:.74rem;letter-spacing:.04em;color:var(--muted)}
.tag-know{color:var(--know)} .tag-conf{color:var(--conf)} .tag-risk{color:var(--risk)} .tag-good{color:var(--good)}

.outro{max-width:var(--maxw);margin:0 auto;padding:14vh clamp(1.4rem,6vw,2rem) 18vh;text-align:center}
.outro h2{font-family:var(--serif);font-weight:300;font-size:clamp(1.8rem,4.5vw,2.6rem);margin-bottom:1rem}
.outro p{color:var(--muted);max-width:44ch;margin:0 auto}

@media (prefers-reduced-motion:reduce){
  .hero .down i{animation:none}
}

/* progress bar */
.progress{position:fixed;top:0;left:0;height:3px;width:100%;z-index:60;background:transparent}
.progress span{display:block;height:100%;width:100%;transform:scaleX(0);transform-origin:0 0;background:linear-gradient(90deg,var(--know),var(--conf));transition:transform .15s linear}
/* topbar lang */
.topbar{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;justify-content:flex-end;padding:1rem 1.4rem;pointer-events:none}
.lang{pointer-events:auto;display:flex;gap:2px;background:rgba(6,24,43,.6);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:999px;padding:3px}
.lang button{background:none;border:none;color:var(--muted);font-family:var(--mono);font-weight:600;font-size:.72rem;letter-spacing:.08em;padding:.34rem .7rem;border-radius:999px;cursor:pointer;transition:background-color .25s,color .25s}
.lang button.active{background:var(--know);color:#04121f}
.lang button:not(.active):hover{color:var(--text)}
/* editorial reveal */
.reveal{opacity:0;transform:translateY(22px);transition:opacity .9s cubic-bezier(.2,.7,.2,1),transform .9s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
.lead .caveat{margin-top:1.4rem;font-size:.9rem;color:var(--muted);border-top:1px solid var(--line);padding-top:1rem;font-style:italic}
/* quiz */
.quizwrap{max-width:680px}
.quiz{display:flex;flex-direction:column;gap:1rem;margin-top:1.6rem;text-align:left}
.guess,.q{border:1px solid var(--line);border-radius:14px;padding:1.1rem 1.2rem;background:rgba(6,24,43,.45)}
.guess label{display:block;font-weight:600;margin-bottom:.7rem}
.guess .row{display:flex;align-items:center;gap:1rem}
.guess input[type=range]{flex:1;accent-color:var(--know);height:6px}
.guess .gval{font-family:var(--serif);font-weight:500;font-size:1.5rem;color:var(--know2);min-width:1.4ch;text-align:center}
.q .qtext{font-weight:600;margin-bottom:.9rem}
.opts{display:flex;flex-direction:column;gap:.55rem}
.opt{text-align:left;background:rgba(196,233,238,.04);border:1px solid var(--line);color:var(--text);padding:.7rem .9rem;border-radius:10px;cursor:pointer;font:inherit;font-size:.98rem;transition:border-color .2s,background .2s}
.opt:hover{border-color:var(--know);background:rgba(78,195,227,.08)}
.opt.correct{border-color:var(--good);background:rgba(79,209,176,.16)}
.opt.wrong{border-color:var(--bad);background:rgba(245,115,111,.14)}
.q.answered .opt:not(.correct):not(.wrong){opacity:.55}
.verdict{margin-top:.7rem;font-size:.9rem;font-weight:600}
.verdict.ok{color:var(--good)}.verdict.no{color:var(--bad)}
.reveal-note{margin-top:.4rem;background:rgba(78,195,227,.08);border:1px solid var(--line);border-radius:12px;padding:1rem 1.1rem;font-size:1rem;color:#e4f3f8;display:none}
.reveal-note.show{display:block}
/* outro */
.outro .acad{margin:2rem auto;max-width:46ch;font-size:.92rem;color:var(--muted);font-style:italic;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:1.2rem 0}
.outro .authors{font-family:var(--serif);font-weight:500;color:var(--text);margin-bottom:2rem}
.btn-row{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:.5rem;font-family:var(--mono);font-weight:600;font-size:.82rem;letter-spacing:.04em;text-decoration:none;padding:.8rem 1.4rem;border-radius:999px;transition:transform .25s,box-shadow .25s}
.btn-primary{background:var(--know);color:#04121f}
.btn-primary:hover{transform:translateY(-3px)}
.btn-ghost{border:1px solid var(--line);color:var(--text)}
.btn-ghost:hover{border-color:var(--know)}
.foot{position:relative;z-index:2;max-width:var(--maxw);margin:0 auto;padding:0 1.4rem 3rem;text-align:center;font-size:.78rem;color:rgba(234,246,251,.34)}
.foot a{color:rgba(234,246,251,.55)}
/* calibration test */
.calibwrap{max-width:700px}
.ctest{display:flex;flex-direction:column;gap:1rem;margin-top:1.6rem;text-align:left}
.ctq{border:1px solid var(--line);border-radius:14px;padding:1.1rem 1.2rem;background:rgba(6,24,43,.45)}
.ctq__q{font-weight:600;margin-bottom:.8rem}
.ctq__opts{display:flex;flex-direction:column;gap:.5rem;margin-bottom:.9rem}
.ctopt{text-align:left;background:rgba(196,233,238,.04);border:1px solid var(--line);color:var(--text);padding:.6rem .85rem;border-radius:10px;cursor:pointer;font:inherit;font-size:.96rem;transition:border-color .2s,background .2s}
.ctopt:hover{border-color:var(--know)}
.ctopt.sel{border-color:var(--know);background:rgba(78,195,227,.12)}
.ctq.done .ctopt{cursor:default}
.ctopt.correct{border-color:var(--good);background:rgba(79,209,176,.16)}
.ctopt.wrong{border-color:var(--bad);background:rgba(245,115,111,.14)}
.ctq.done .ctopt:not(.correct):not(.wrong){opacity:.5}
.ctq__conf{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;font-size:.84rem;color:var(--muted)}
.ctc{background:none;border:1px solid var(--line);color:var(--muted);padding:.34rem .8rem;border-radius:999px;cursor:pointer;font:inherit;font-size:.8rem;transition:border-color .2s,background .2s,color .2s}
.ctc:hover{border-color:var(--conf);color:var(--text)}
.ctc.sel{border-color:var(--conf);background:rgba(201,140,212,.16);color:var(--text)}
.ctest__go{align-self:flex-start;font-family:var(--mono);font-weight:600;font-size:.82rem;letter-spacing:.04em;background:var(--know);color:#04121f;border:none;padding:.8rem 1.4rem;border-radius:999px;cursor:pointer;transition:transform .2s,opacity .2s}
.ctest__go:disabled{opacity:.38;cursor:not-allowed}
.ctest__go:not(:disabled):hover{transform:translateY(-2px)}
.ctest__result{border:1px solid var(--line);border-radius:14px;padding:1.3rem 1.4rem;background:rgba(6,24,43,.62)}
.ctr__row{display:flex;justify-content:space-between;align-items:baseline;padding:.45rem 0;border-bottom:1px solid var(--line)}
.ctr__row span{color:var(--muted);font-size:.92rem}
.ctr__row b{font-family:var(--serif);font-size:1.35rem;font-weight:500}
.ctr__gap{display:flex;justify-content:space-between;align-items:baseline;padding:.75rem 0 .2rem}
.ctr__gap span{color:var(--muted);font-size:.92rem}
.ctr__gap b{font-family:var(--serif);font-size:2rem;font-weight:500}
.ctr__verdict{font-family:var(--serif);font-size:1.18rem;margin:.5rem 0 .85rem}
.ctr__tie{font-size:.9rem;color:var(--muted);border-top:1px solid var(--line);padding-top:.85rem;margin:0}
/* stronger dark dim behind data figures + text (calmer field, data/text pops) */
.scrolly__sticky::before{background:radial-gradient(78% 72% at 50% 46%,rgba(0,7,14,.9),rgba(0,7,14,.46) 58%,transparent 84%)}
.lead::before{background:radial-gradient(closest-side,rgba(0,8,15,.86),rgba(0,8,15,0))}
.scrolly__caption{position:relative}
.scrolly__caption::before{content:'';position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:130%;height:280%;z-index:-1;pointer-events:none;background:radial-gradient(closest-side,rgba(0,8,15,.74),transparent)}
.outro{position:relative;z-index:2}
.outro::before{content:'';position:absolute;left:50%;top:48%;transform:translateX(-50%);width:150vw;height:150%;z-index:-1;pointer-events:none;background:radial-gradient(closest-side,rgba(0,5,11,.93),rgba(0,5,11,.5) 50%,transparent 78%)}
/* outro: trim dead space below + dim reaches under the buttons */
.outro{padding-top:13vh;padding-bottom:4vh}
.outro::before{top:50%;height:124%;transform:translate(-50%,-50%);background:radial-gradient(closest-side,rgba(0,4,9,.97),rgba(0,4,9,.82) 48%,rgba(0,4,9,.4) 72%,transparent 88%)}
.foot{padding-bottom:2.4rem}
/* larger, clearer explanatory sub-texts site-wide */
.cap{font-size:1.06rem}
.cap small{font-size:.85rem;color:rgba(234,246,251,.75);margin-top:.7rem}
.lead .caveat{font-size:1rem;color:rgba(234,246,251,.7)}
.ctr__tie{font-size:1rem;color:rgba(234,246,251,.72)}

</style>
</head>
<body>
<div class="backdrop"></div><canvas class="bgfield" id="bgfield" aria-hidden="true"></canvas>
<div class="progress"><span id="progressBar"></span></div>
<div class="topbar"><div class="lang" role="group" aria-label="Language"><button id="langNo" class="active">NO</button><button id="langEn">EN</button></div></div>
<div class="rail" aria-hidden="true"><div class="rail__track"><div class="rail__fill" id="railFill"></div><div class="rail__marks" id="railMarks"></div></div></div>

<main>
  <header class="hero">
    <div class="kicker" data-i18n="kicker"></div>
    <h1 data-i18n="hero_h"></h1>
    <p data-i18n="hero_sub"></p>
    <div class="down"><span data-i18n="scrollcue"></span><i></i></div>
  </header>

<section class="scrolly" data-fig="growth" data-part="1">
  <div class="scrolly__sticky">
    <div class="stage"><div class="med-eyebrow">Vekst: flere private aksjonærer</div><svg viewBox="0 0 960 460" role="img" aria-label="Linjediagram: antall norske private aksjonærer 2014 til 2025, stiger forbi 600 000">
  <defs>
    <linearGradient id="growth-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4ec3e3" stop-opacity=".26"/>
      <stop offset="1" stop-color="#4ec3e3" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="growth-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#c4e9ee" stop-opacity=".85"/>
      <stop offset="1" stop-color="#c4e9ee" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- hairline baseline + faint gridlines -->
  <line x1="90" y1="360" x2="880" y2="360" stroke="rgba(196,233,238,.14)"/>
  <line id="growth-grid6" x1="90" y1="215" x2="880" y2="215" stroke="rgba(196,233,238,.14)" stroke-dasharray="2 6" opacity="0"/>
  <line id="growth-grid3" x1="90" y1="288" x2="880" y2="288" stroke="rgba(196,233,238,.14)" stroke-dasharray="2 6" opacity="0"/>

  <!-- y reference label for the 600k gridline -->
  <text id="growth-ylbl" x="90" y="206" fill="#88a0b0" font-size="11" font-family="'JetBrains Mono',monospace" opacity="0">600 000</text>

  <!-- area under the line (revealed via clip-like opacity) -->
  <path id="growth-area" d="M90,338 L162,341 L234,344 L306,343 L378,340 L450,336 L522,331 L594,310 L666,268 L738,222 L810,190 L880,162 L880,360 L90,360 Z" fill="url(#growth-fill)" opacity="0"/>

  <!-- the rising line, draws left to right -->
  <path id="growth-line" d="M90,338 L162,341 L234,344 L306,343 L378,340 L450,336 L522,331 L594,310 L666,268 L738,222 L810,190 L880,162" fill="none" stroke="#4ec3e3" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/>

  <!-- pulsing end glow + dot -->
  <circle id="growth-pulse" cx="880" cy="162" r="20" fill="url(#growth-glow)" opacity="0"/>
  <circle id="growth-dot" cx="880" cy="162" r="6" fill="#c4e9ee" stroke="#00101e" stroke-width="1.5" opacity="0"/>

  <!-- big serif counter, centred upper-left of the rise -->
  <g id="growth-counter" opacity="0">

<!-- ===== particle field: VERTICAL curtain, mouse-reactive (cursor parts the field + bulges it toward you; parallax) ===== -->
<script type="module">
(async function(){
  "use strict";
  var canvas=document.getElementById('bgfield'); if(!canvas) return;
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var THREE; try{ THREE=await import('https://unpkg.com/three@0.160.0/build/three.module.min.js'); }catch(e){ return; }
  try{
    var renderer=new THREE.WebGLRenderer({canvas:canvas,alpha:true,antialias:true,powerPreference:'high-performance'});
    renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
    var scene=new THREE.Scene();
    var camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.1,200);
    var BASE_Z=7;
    camera.position.set(0,0,BASE_Z); camera.lookAt(0,0,0);

    // VERTICAL curtain on the XY-plane, facing the viewer (fills the screen, fades at the edges)
    var small=innerWidth<760;
    var COLS=small?86:132, ROWS=small?78:112, GAP=0.13, n=COLS*ROWS;
    var bx=new Float32Array(n), by=new Float32Array(n);          // base grid (with slight jitter)
    var pos=new Float32Array(n*3), col=new Float32Array(n*3);
    var cNear=new THREE.Color(0x7ad7f1), cFar=new THREE.Color(0x18414f);
    var halfW=(COLS*GAP)/2, halfH=(ROWS*GAP)/2, maxR=Math.hypot(halfW,halfH), k=0;
    for(var yy=0;yy<ROWS;yy++)for(var xx=0;xx<COLS;xx++){
      var jx=Math.sin(k*12.9898)*0.5, jy=Math.cos(k*78.233)*0.5;  // deterministic jitter so it isn't a rigid grid
      var X=(xx-COLS/2)*GAP+jx*GAP*0.7, Y=(yy-ROWS/2)*GAP+jy*GAP*0.7;
      bx[k]=X; by[k]=Y;
      pos[k*3]=X; pos[k*3+1]=Y; pos[k*3+2]=0;
      var rr=Math.hypot(X,Y)/maxR;
      var c=cNear.clone().lerp(cFar,Math.pow(rr,0.92));
      col[k*3]=c.r; col[k*3+1]=c.g; col[k*3+2]=c.b; k++;
    }
    var geo=new THREE.BufferGeometry();
    geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
    geo.setAttribute('color',new THREE.BufferAttribute(col,3));
    var field=new THREE.Points(geo,new THREE.PointsMaterial({size:small?0.05:0.04,vertexColors:true,transparent:true,opacity:0.95,depthWrite:false,blending:THREE.AdditiveBlending,sizeAttenuation:true}));
    scene.add(field);
    var arr=geo.attributes.position.array;

    // selectable mouse reaction: ?fx=parting|attract|ripple|swirl|risk (default parting)
    var FXMAP={parting:0,attract:1,ripple:2,swirl:3,risk:4};
    var FXI=FXMAP[(new URLSearchParams(location.search).get('fx')||'swirl')]; if(FXI==null)FXI=3;
    var heat=new Float32Array(n);       // for the 'risk' heat-bloom
    var baseCol=col.slice(0);           // pristine colours to tint from

    var sy=0; addEventListener('scroll',function(){sy=scrollY||pageYOffset||0;},{passive:true});
    var nx=0, ny=0, hasPtr=false;
    addEventListener('pointermove',function(e){ nx=(e.clientX/innerWidth)*2-1; ny=-(e.clientY/innerHeight)*2+1; hasPtr=true; },{passive:true});
    addEventListener('pointerleave',function(){ hasPtr=false; },{passive:true});
    var ndc=new THREE.Vector2(), ray=new THREE.Raycaster(), plane=new THREE.Plane(new THREE.Vector3(0,0,1),0), hit=new THREE.Vector3();
    var cur=new THREE.Vector3(0,0,0), tgt=new THREE.Vector3(0,0,0), cInf=0, cInfT=0;
    var camX=0, camY=0;

    function resize(){renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();}
    addEventListener('resize',resize,{passive:true}); resize();

    var R=2.2, R2=R*R, PUSH=1.0, FWD=1.7, PULL=0.72, RR=4.6, RR2=RR*RR, raf=0, run=false;
    function frame(now){
      var t=now*0.001;
      if(hasPtr){ ndc.set(nx,ny); ray.setFromCamera(ndc,camera); if(ray.ray.intersectPlane(plane,hit)) tgt.copy(hit); cInfT=1; }
      else cInfT=0;
      cur.lerp(tgt,0.16); cInf += (cInfT-cInf)*0.07;             // fade interaction in/out
      var cx=cur.x, cy=cur.y, act=cInf>0.01, hot=(FXI===4);
      for(var i=0;i<n;i++){
        var i3=i*3, X=bx[i], Y=by[i];
        var zw=Math.sin(X*1.35+t*0.55)*0.3+Math.cos(Y*1.1-t*0.45)*0.3;   // gentle depth shimmer
        var x=X, y=Y, z=zw;
        var dx=X-cx, dy=Y-cy, d2=dx*dx+dy*dy;
        if(act){
          if(FXI===0){            // DELING: part the curtain + bulge toward viewer
            if(d2<R2){ var d=Math.sqrt(d2),inf=(1-d/R);inf*=inf;inf*=cInf;var inv=d>1e-4?1/d:0; x=X+dx*inv*PUSH*inf; y=Y+dy*inv*PUSH*inf; z=zw+FWD*inf; }
          } else if(FXI===1){     // TILTREKNING: gather toward cursor + bulge (glowing core)
            if(d2<R2){ var d1=Math.sqrt(d2),i1=(1-d1/R);i1*=i1;i1*=cInf; x=X-dx*PULL*i1; y=Y-dy*PULL*i1; z=zw+FWD*i1; }
          } else if(FXI===2){     // SJOKKBØLGE: concentric z-rings radiating from cursor
            if(d2<RR2){ var d2s=Math.sqrt(d2),fo=(1-d2s/RR);fo*=fo; z=zw+1.6*Math.sin(d2s*3.0 - t*5.0)*fo*cInf; }
          } else if(FXI===3){     // VIRVEL: rotate points around the cursor
            if(d2<R2){ var d3=Math.sqrt(d2),i3f=(1-d3/R);i3f*=i3f;i3f*=cInf;var a=i3f*1.7,ca=Math.cos(a),sa=Math.sin(a); x=cx+dx*ca-dy*sa; y=cy+dx*sa+dy*ca; z=zw+0.5*i3f; }
          } else {                // RISIKO: heat bloom, warm + turbulent near cursor, cools back
            var inr=0; if(d2<R2){ var d4=Math.sqrt(d2);inr=(1-d4/R);inr*=inr;inr*=cInf; }
            heat[i]=Math.max(heat[i]*0.95, inr); var h=heat[i];
            if(h>0.002){ var jt=h*0.55; x=X+Math.sin(X*9.1+t*7.0+i)*jt; y=Y+Math.cos(Y*8.7-t*6.3+i)*jt; z=zw*(1+h*1.6)+h*0.7; }
          }
        } else if(hot){ heat[i]*=0.95; }
        arr[i3]=x; arr[i3+1]=y; arr[i3+2]=z;
        if(hot){ var hh=heat[i]>1?1:heat[i]; col[i3]=baseCol[i3]+(1.0-baseCol[i3])*hh; col[i3+1]=baseCol[i3+1]+(0.62-baseCol[i3+1])*hh; col[i3+2]=baseCol[i3+2]+(0.48-baseCol[i3+2])*hh; }
      }
      geo.attributes.position.needsUpdate=true;
      if(hot) geo.attributes.color.needsUpdate=true;
      camX += ((hasPtr?nx:0)*0.7 - camX)*0.045;                 // pointer parallax
      camY += ((hasPtr?ny:0)*0.5 - camY)*0.045;
      camera.position.set(camX, camY - Math.min(sy,6000)*0.00009, BASE_Z);
      camera.lookAt(camX*0.5, camY*0.5, 0);
      renderer.render(scene,camera);
      raf=requestAnimationFrame(frame);
    }
    function start(){if(run)return;run=true;raf=requestAnimationFrame(frame);} function stop(){run=false;if(raf)cancelAnimationFrame(raf);raf=0;}
    document.addEventListener('visibilitychange',function(){document.hidden?stop():start();});
    canvas.addEventListener('webglcontextlost',function(e){e.preventDefault();stop();canvas.classList.remove('on');});
    canvas.classList.add('on'); start();
  }catch(err){}
})();
</script>
<script>
window.smooth=function(e0,e1,x){var t=(x-e0)/(e1-e0); t=t<0?0:t>1?1:t; return t*t*(3-2*t);};
window.clamp=function(v,a,b){return v<a?a:v>b?b:v;};
window.nf=new Intl.NumberFormat('nb-NO');
window.__FIGFNS={'growth':function(p){// --- Vekst: line draws left->right, serif counter scrubs to 600 000, end dot pulses in ---
var line=document.getElementById('growth-line');
var area=document.getElementById('growth-area');
var dot=document.getElementById('growth-dot');
var pulse=document.getElementById('growth-pulse');
var counter=document.getElementById('growth-counter');
var num=document.getElementById('growth-num');
var endpill=document.getElementById('growth-endpill');
var grid6=document.getElementById('growth-grid6');
var grid3=document.getElementById('growth-grid3');
var ylbl=document.getElementById('growth-ylbl');
var pandemic=document.getElementById('growth-pandemic');

// beat 1: gridlines settle in early (0 -> .12)
var gridIn=smooth(0.00,0.12,p);
grid3.setAttribute('opacity', (0.5*gridIn).toFixed(3));

// beat 2: the line draws across the full decade (0.06 -> 0.80)
var draw=smooth(0.06,0.80,p);
line.setAttribute('stroke-dashoffset', (1-draw).toFixed(4));
// area fills in just behind the leading edge
area.setAttribute('opacity', (0.9*smooth(0.10,0.78,p)).toFixed(3));

// the 600k gridline + label resolve as the line climbs into that band (0.45 -> 0.72)
var hi=smooth(0.45,0.72,p);
grid6.setAttribute('opacity', (0.6*hi).toFixed(3));
ylbl.setAttribute('opacity', hi.toFixed(3));

// beat 3: serif counter scrubs 0 -> 600 000, tracking the climb (0.10 -> 0.90)
counter.setAttribute('opacity', smooth(0.08,0.20,p).toFixed(3));
var target=Math.round(600000*smooth(0.10,0.90,p));
num.textContent=nf.format(target);

// beat 4: bright end dot + pulse + value pill arrive once the line lands (0.80 -> 0.96)
var land=smooth(0.80,0.96,p);
dot.setAttribute('opacity', land.toFixed(3));
endpill.setAttribute('opacity', smooth(0.84,0.98,p).toFixed(3));
// gentle breathing pulse on the end dot, only after it has landed
var breathe=0.5+0.5*Math.sin(p*Math.PI*6.0);
pulse.setAttribute('opacity', (land*(0.35+0.45*breathe)).toFixed(3));
var rr=(16+8*land+4*breathe*land).toFixed(2);
pulse.setAttribute('r', rr);

// pandemic context marker fades in at the end (0.82 -> 1)
pandemic.setAttribute('opacity', smooth(0.82,1.00,p).toFixed(3));
},

window.__CAPS={"growth":{"no":[{"from":0,"html":"<span class=\"big\">De siste årene har stadig flere nordmenn begynt å investere.</span>Antallet private aksjonærer har klatret jevnt gjennom hele tiåret.<small>Eierskap i børsnoterte selskaper · privatpersoner · 2014 til 2025</small>"},{"from":0.5,"html":"Over <b class=\"tag-know\">600 000</b> private aksjonærer i Norge i 2025, opp fra rundt 360 000 ti år tidligere.<small>En av de bredeste folkelige eierandelene i Europa</small>"},{"from":0.85,"html":"Mange er helt <b>ferske</b>, kommet til etter pandemien. Men de starter fra <b class=\"tag-conf\">svært ulik forståelse</b> av hva de faktisk kan.<small>Bredden i deltakelse skjuler store forskjeller i kunnskap</small>"}],"en":[{"from":0,"html":"<span class=\"big\">More and more Norwegians have started investing.</span>The number of private shareholders has climbed steadily through the decade.<small>Ownership in listed companies · individuals · 2014 to 2025</small>"},{"from":0.5,"html":"Over <b class=\"tag-know\">600 000</b> private shareholders in Norway in 2025, up from around 360 000 ten years earlier.<small>One of the broadest popular ownership bases in Europe</small>"},{"from":0.85,"html":"Many are entirely <b>new</b>, arriving after the pandemic. But they start from <b class=\"tag-conf\">very different levels of understanding</b> of what they actually know.<small>Breadth of participation hides large gaps in knowledge</small>"}]},"funnel":{"no":[{"from":0,"html":"Vi gikk dit investorene faktisk er: <b>Reddit</b>, <b>Shareville (nå Nordnet Social)</b> og <b>Facebook</b>.<small>Selvrekruttert utvalg, ikke et tilfeldig befolkningsutvalg</small>"},{"from":0.32,"html":"<span class=\"big\"><b>1 027</b> svarte.</span>Det rå datasettet, for vi luker ut det som ikke holder.<small>Rå responser samlet inn</small>"},{"from":0.52,"html":"Vi tok ut <span class=\"tag-risk\">mindreårige</span>, <span class=\"tag-risk\">uoppmerksomme</span> (strøk kontrollspørsmål, <b>-262</b>) og <span class=\"tag-risk\">ufullstendige</span> svar.<small>Forhåndsdefinerte eksklusjonskriterier</small>"},{"from":0.86,"html":"<span class=\"big\"><b class=\"tag-good\">750</b> står igjen.</span>Grunnlaget for hele analysen.<small>Ren analysebase, N = 750</small>"}],"en":[{"from":0,"html":"We went where investors actually are: <b>Reddit</b>, <b>Shareville (now Nordnet Social)</b> and <b>Facebook</b>.<small>Self-selected sample, not a random population draw</small>"},{"from":0.32,"html":"<span class=\"big\"><b>1,027</b> answered.</span>The raw dataset, before we clean out what does not hold up.<small>Raw responses collected</small>"},{"from":0.52,"html":"We removed <span class=\"tag-risk\">minors</span>, the <span class=\"tag-risk\">inattentive</span> (failed the attention check, <b>-262</b>) and <span class=\"tag-risk\">incomplete</span> answers.<small>Pre-registered exclusion criteria</small>"},{"from":0.86,"html":"<span class=\"big\"><b class=\"tag-good\">750</b> remain.</span>The basis for the entire analysis.<small>Clean analysis base, N = 750</small>"}]},"ceiling":{"no":[{"from":0,"html":"<span class=\"big\">Nesten alle er skarpe.</span>Vi målte <span class=\"tag-know\">finansiell kunnskap</span> med 6 sann/usann-påstander. Her er fordelingen av antall riktige.<small>N = 750 · skår 0 til 6</small>"},{"from":0.4,"html":"<b class=\"tag-know\">73,7 %</b> fikk full pott (6 av 6). Over <b>90 %</b> landet på 5 eller 6.<small>snitt 5,63 av 6</small>"},{"from":0.7,"html":"<span class=\"big\">Da er det knapt variasjon igjen å måle på.</span>Når nesten alle ligger på toppen, blir <span class=\"tag-know\">kunnskap</span> nesten en konstant, ikke en variabel.<small>tak-effekt (ceiling effect)</small>"},{"from":0.9,"html":"Derfor leses alle kunnskaps-effektene i oppgaven som <b>forsiktige nedre grenser</b>. Nesten all variasjon ligger i ett eneste hakk: <b class=\"tag-risk\">5 mot 6</b>.<small>komprimert varians, dempet målt effekt</small>"}],"en":[{"from":0,"html":"<span class=\"big\">Almost everyone is sharp.</span>We measured <span class=\"tag-know\">financial knowledge</span> with 6 true/false items. Here is the distribution of correct answers.<small>N = 750 · score 0 to 6</small>"},{"from":0.4,"html":"<b class=\"tag-know\">73,7 %</b> scored full marks (6 of 6). Over <b>90 %</b> landed on 5 or 6.<small>mean 5,63 of 6</small>"},{"from":0.7,"html":"<span class=\"big\">There is barely any variation left to measure.</span>When almost everyone sits at the ceiling, <span class=\"tag-know\">knowledge</span> behaves like a constant, not a variable.<small>ceiling effect</small>"},{"from":0.9,"html":"So every knowledge effect in the thesis reads as a <b>conservative lower bound</b>. Almost all the variation sits in a single notch: <b class=\"tag-risk\">5 versus 6</b>.<small>compressed variance, attenuated measured effect</small>"}]},"findings3":{"no":[{"from":0,"html":"<span class=\"big\">Tre funn, fortalt enkelt.</span>Mer kunnskap henger sammen med tre ting, og ett av dem stikker seg kraftig ut."},{"from":0.26,"html":"De som kan mer <span class=\"tag-know\">sprer pengene litt bredere</span> og <span class=\"tag-risk\">tar litt mer risiko</span>. Begge er små effekter, og risiko-funnet er skjørt."},{"from":0.54,"html":"<span class=\"big\">Men det store: de <span class=\"tag-conf\">kjenner seg selv mye bedre</span>.</span>Mye mindre gap mellom hva de tror og hva de faktisk kan. Det er funnet som virkelig holder."}],"en":[{"from":0,"html":"<span class=\"big\">Three findings, told simply.</span>More knowledge goes with three things, and one of them stands out sharply."},{"from":0.26,"html":"Those who know more <span class=\"tag-know\">spread their money a little wider</span> and <span class=\"tag-risk\">take a little more risk</span>. Both are small, and the risk finding is fragile."},{"from":0.54,"html":"<span class=\"big\">But the big one: they <span class=\"tag-conf\">know themselves much better</span>.</span>A much smaller gap between what they think and what they actually know. That is the finding that really holds."}]},"calib":{"no":[{"from":0,"html":"<span class=\"big\">Det sterkeste funnet i oppgaven.</span>De som faktisk kan mer, kjenner seg selv bedre.<small>x = <span class=\"tag-know\">finansiell kunnskap</span> · y = overmot-gap (tror minus kan)</small>"},{"from":0.5,"html":"Mer kunnskap, <b>mindre gap</b> mellom hva de tror og hva de faktisk kan. <b class=\"tag-know\"></b>.<small>negativ sammenheng · N = 714 · gap = 0 er perfekt kalibrering</small>"},{"from":0.8,"html":"Sammenhengen <b class=\"tag-good\">holdt i alle robusthetssjekkene</b>: ulike mål, delutvalg og kontroller.<small>retningen og styrken endrer seg lite</small>"},{"from":0.9,"html":"Ærlig forbehold: måler vi gapet <b>mer konservativt</b>, blir effekten svakere, men fortsatt negativ.<small>en del av rå-gapet er mekanisk · poenget står</small>"}],"en":[{"from":0,"html":"<span class=\"big\">The thesis's strongest finding.</span>Those who actually know more judge themselves better.<small>x = <span class=\"tag-know\">financial literacy</span> · y = overconfidence gap (think minus know)</small>"},{"from":0.5,"html":"More knowledge, a <b>smaller gap</b> between what they think and what they actually know. <b class=\"tag-know\"></b>.<small>negative relationship · N = 714 · gap = 0 is perfect calibration</small>"},{"from":0.8,"html":"The relationship <b class=\"tag-good\">survived every robustness check</b>: alternative measures, subsamples, controls.<small>direction and strength barely move</small>"},{"from":0.9,"html":"Honest caveat: measure the gap <b>more conservatively</b> and the effect weakens, though it stays negative.<small>part of the raw gap is mechanical · the point holds</small>"}]},"mediation":{"no":[{"from":0,"html":"<span class=\"big\">Påvirker kunnskap risiko <em>direkte</em>, eller via selvtilliten?</span><small>To kandidat-veier. Vi måler hvilken som faktisk virker.</small>"},{"from":0.2,"html":"<span class=\"big\">Den <span class=\"tag-know\">direkte</span> veien finnes.</span>Mer kunnskap henger sammen med litt mer risiko. <b>Samlet effekt c = 0,100</b> (p = 0,008).<small>OLS · standardisert kunnskap · N = 714</small>"},{"from":0.42,"html":"Men kunnskap gjør deg også <span class=\"tag-conf\">tryggere på deg selv</span>. <b>a = 0,211</b> (p &lt; 0,001).<small>Kunnskap → subjektiv selvtillit</small>"},{"from":0.6,"html":"Og den tryggheten driver <span class=\"tag-risk\">risikoviljen</span>. <b>b = 0,275</b> (p &lt; 0,001).<small>Selvtillit → risiko, kontrollert for kunnskap</small>"},{"from":0.8,"html":"<span class=\"big\">Holder vi selvtilliten konstant, <span class=\"tag-conf\">forsvinner</span> den direkte koblingen.</span><b>c′ = 0,042, ikke signifikant.</b> ≈ <b class=\"tag-good\">57 %</b> av sammenhengen går gjennom selvtillit.<small>indirekte a·b = 0,058 · 95 % KI [0,035–0,089] · 5000 bootstrap</small>"}],"en":[{"from":0,"html":"<span class=\"big\">Does knowledge affect risk <em>directly</em>, or through confidence?</span><small>Two candidate paths. We measure which one does the work.</small>"},{"from":0.2,"html":"<span class=\"big\">The <span class=\"tag-know\">direct</span> path exists.</span>More knowledge goes with a little more risk. <b>Total effect c = 0,100</b> (p = 0,008).<small>OLS · standardised knowledge · N = 714</small>"},{"from":0.42,"html":"But knowledge also makes you <span class=\"tag-conf\">more sure of yourself</span>. <b>a = 0,211</b> (p &lt; 0,001).<small>Knowledge → subjective confidence</small>"},{"from":0.6,"html":"And that self-assurance drives <span class=\"tag-risk\">risk-taking</span>. <b>b = 0,275</b> (p &lt; 0,001).<small>Confidence → risk, controlling for knowledge</small>"},{"from":0.8,"html":"<span class=\"big\">Hold confidence constant and the direct link <span class=\"tag-conf\">disappears</span>.</span><b>c′ = 0,042, not significant.</b> ≈ <b class=\"tag-good\">57 %</b> of the relationship runs through confidence.<small>indirect a·b = 0,058 · 95 % CI [0,035–0,089] · 5000 bootstrap</small>"}]}};

 var I18N={"no":{"kicker":"Masteroppgave · BI · 2026","hero_h":"Vet du like mye som du tror?","hero_sub":"En masteroppgave om norske investorer, kunnskap og selvtillit, fortalt med data.","scrollcue":"Bla for å begynne","map_eyebrow":"Del 1 · Motivasjon","map_h":"Men ikke alle forstår like mye","map_b":"Selv i et land som skårer høyt på finanskunnskap er forskjellene store fra person til person. Noen forstår renter, gebyrer og risiko godt. Andre kaster seg ut i markedet med store hull i forståelsen.","bb1_eyebrow":"Del 2 · Teori","bb1_h":"Byggekloss 1: hva du faktisk kan","bb1_b":"Finansiell kunnskap er rett og slett om du forstår grunnreglene: renters rente, inflasjon, gebyrer og det å spre risiko. Det er grunnmuren under alle pengebeslutninger, og den kan måles.","bb2_eyebrow":"Del 2 · Teori","bb2_h":"Byggekloss 2: hva du tror du kan","bb2_b":"Selvtillit er hvor flink du tror du er. Kalibrering er hvor godt troen treffer virkeligheten. Når troen på egen kunnskap er større enn den faktiske kunnskapen, kaller vi det overmot, og da undervurderer du lett risikoen.","bb34_eyebrow":"Del 2 · Teori","bb34_h":"Byggekloss 3 og 4: risiko og spredning","bb34_b":"Risikovilje er hvor mye svingninger og mulig tap du tåler for sjansen til høyere avkastning. Diversifisering er å ikke legge alle eggene i én kurv. To enkle, målbare størrelser.","sample_eyebrow":"Del 3 · Metode","sample_h":"Hvem er det vi har målt?","sample_b":"Utvalget er investor-aktivt, mannsdominert (84 %) og rekruttert fra nettsamfunn. Vi beskriver altså variasjon innad i et engasjert investormiljø, ikke hele Norges befolkning. Det er en bevisst avgrensning.","findings_eyebrow":"Del 4 · Resultater","findings_h":"Fire funn, én rød tråd","findings_b":"Mer kunnskap henger sammen med bredere spredning, litt mer risiko, og klart bedre selvinnsikt. Men det mest interessante er ikke om kunnskap betyr noe, det er hvilken vei den virker gjennom.","twopaths_eyebrow":"Del 4 · Resultater","twopaths_h":"Hjertet i oppgaven: to mulige veier","twopaths_b":"Tenk på en kirurg: å lese teori på skolebenken gjør deg ikke klar til å operere over natten. Men kunnskapen bygger selvtillit, selvtilliten får deg til å tørre praksis, og praksisen fører til slutt til operasjonsbordet. Det samme spørsmålet gjelder investorer: virker kunnskap på risiko direkte, eller gjennom selvtilliten? Bla videre, så måler vi det.","conclusion_eyebrow":"Del 4 · Konklusjon","conclusion_h":"Kunnskap former kvaliteten på risikoen","conclusion_b":"Finansiell kunnskap dytter deg ikke blindt mot mer risiko. Den ser ut til å gi mer informert og bedre kalibrert risiko, og veien dit går gjennom selvtilliten. For finansopplæring betyr det: ikke bare pøs på fakta, hjelp folk å vurdere sin egen kunnskap riktig.","conclusion_caveat":"Husk: dette er et øyeblikksbilde (ikke årsak), et skjevt utvalg, og kunnskap nær taket. Funnene gjelder investor-Norge, ikke nødvendigvis alle.","quiz_eyebrow":"Del 3 · Metode","quiz_h":"Prøv selv før vi forteller","quiz_prompt":"Hvor mange av disse tror du at du klarer? Tipp først, så prøver du.","quiz_guesslabel":"Min gjetning (0–6):","q1_q":"Du setter 100 kr på konto til 6 % rente. Hvor mye har du etter to år, uten uttak?","q1_o0":"106 kr","q1_o1":"112 kr","q1_o2":"112,36 kr","q1_o3":"130 kr","q2_q":"En aksje faller 50 %. Hvor mye må den stige året etter for å være tilbake til start?","q2_o0":"50 %","q2_o1":"75 %","q2_o2":"100 %","quiz_reveal":"Snittinvestoren i undersøkelsen klarte 5,63 av 6. Kunnskapsnivået var altså høyt, husk det, det blir viktig snart.","qOk":"Riktig!","qNo":"Ikke helt, riktig svar er markert.","ct_eyebrow":"Del 3 · Metode","ct_h":"Hvor godt kjenner du deg selv?","ct_intro":"Svar på tre spørsmål, og si hvor sikker du er på hvert. Til slutt måler vi ditt eget overmot-gap, akkurat som i oppgaven.","ct_q1":"Du setter 100 kr på konto til 6 % rente. Hvor mye har du etter to år, uten uttak?","ct_q1_o0":"106 kr","ct_q1_o1":"112 kr","ct_q1_o2":"112,36 kr","ct_q1_o3":"130 kr","ct_q2":"En aksje faller 50 %. Hvor mye må den stige året etter for å være tilbake til start?","ct_q2_o0":"50 %","ct_q2_o1":"75 %","ct_q2_o2":"100 %","ct_q3":"Kontoen din gir 1 % rente og inflasjonen er 3 %. Hvordan endrer kjøpekraften seg på ett år?","ct_q3_o0":"Den øker","ct_q3_o1":"Den synker","ct_q3_o2":"Den er uendret","ct_conflbl":"Hvor sikker?","ct_conf0":"Gjetter","ct_conf1":"Ganske sikker","ct_conf2":"Sikker","ct_go":"Vis resultatet","ct_score":"Du fikk riktig","ct_conf":"Din snitt-selvtillit","ct_gap":"Ditt overmot-gap","ct_over":"Du er overmodig: troen løper foran kunnskapen.","ct_under":"Du er beskjeden: du kan mer enn du tror.","ct_cal":"Du er godt kalibrert: troen treffer kunnskapen.","ct_tie":"Snittinvestoren i studien var overmodig, men gapet krympet med kunnskap. Det er nettopp dette H4 måler.","outro_h":"Takk for at du leste","outro_b":"En masteroppgave i finans, gjort tilgjengelig for alle. Vil du lese hele? Den ligger her.","outro_acad":"«How does financial literacy – or lack thereof – influence risk-taking behaviour, overconfidence and portfolio construction among Norwegian investors?»","outro_authors":"Henrik Bekkevold og Valiant Evers · MSc Finance · BI Norwegian Business School · 2026","outro_pdf":"Last ned oppgaven (PDF)","outro_back":"Tilbake til prosjekter","foot":"© 2026 Henrik Bekkevold & Valiant Evers","figt_growth":"Vekst: flere private aksjonærer","figl_0":"private aksjonærer i Norge, 2025","figt_funnel":"Rensing","figl_1":"Reddit","figl_2":"Shareville (nå Nordnet Social)","figl_3":"Facebook","figl_4":"respondenter","figl_5":"Strøk oppmerksomhetssjekk","figl_6":"Under 18 år","figl_7":"Ufullstendige svar","figl_8":"analysegrunnlag","figt_ceiling":"Kunnskaps-taket","figl_9":"antall respondenter (N = 750)","figl_10":"KUNNSKAPSSKÅR (0 TIL 6 RIKTIGE)","figl_11":"snitt 5,63","figl_12":"fikk full pott (553 av 750)","figt_calib":"Kalibrering","figl_13":"lav","figl_14":"KUNNSKAP","figl_15":"høy","figl_16":"OVERMOT-GAP","figl_17":"gap = 0 : perfekt kalibrering","figl_18":"over linjen: overmodig","figl_19":"under linjen: beskjeden","figt_mediation":"Kunnskap → Selvtillit → Risiko","figl_20":"Kunnskap","figl_21":"Selvtillit","figl_22":"Risiko","figl_23":"av sammenhengen via selvtillit","figt_findings3":"Tre funn, ett bilde","figl_24":"Sprer pengene litt bredere","figl_25":"Tar litt mer risiko","figl_26":"(funnet er skjørt)","figl_27":"Kjenner seg selv mye bedre","figl_28":"det klart sterkeste funnet"},"en":{"kicker":"Master’s thesis · BI · 2026","hero_h":"Do you know as much as you think you do?","hero_sub":"A master’s thesis on Norwegian investors, knowledge and confidence, told with data.","scrollcue":"Scroll to begin","map_eyebrow":"Part 1 · Motivation","map_h":"But not everyone understands the same amount","map_b":"Even in a country that scores high on financial knowledge, the gaps between people are wide. Some understand interest, fees and risk well. Others dive into the market with big gaps in their understanding.","bb1_eyebrow":"Part 2 · Theory","bb1_h":"Building block 1: what you actually know","bb1_b":"Financial literacy is simply whether you understand the basics: compound interest, inflation, fees and spreading risk. It is the bedrock under every money decision, and it can be measured.","bb2_eyebrow":"Part 2 · Theory","bb2_h":"Building block 2: what you think you know","bb2_b":"Confidence is how good you think you are. Calibration is how well that belief matches reality. When belief outruns the knowledge itself, we call it overconfidence, and you tend to underestimate risk.","bb34_eyebrow":"Part 2 · Theory","bb34_h":"Building blocks 3 and 4: risk and spreading","bb34_b":"Risk tolerance is how much swing and possible loss you will stomach for a shot at higher returns. Diversification is not putting all your eggs in one basket. Two simple, measurable quantities.","sample_eyebrow":"Part 3 · Method","sample_h":"Who exactly did we measure?","sample_b":"The sample is investor-active, male-dominated (84%) and recruited from online communities. So we describe variation within an engaged investor crowd, not the Norwegian population as a whole. A deliberate scope.","findings_eyebrow":"Part 4 · Results","findings_h":"Four findings, one thread","findings_b":"More knowledge goes with broader spread, a little more risk, and clearly sharper self-insight. But the most interesting question is not whether knowledge matters, it is which path it works through.","twopaths_eyebrow":"Part 4 · Results","twopaths_h":"The heart of the thesis: two possible paths","twopaths_b":"Picture a surgeon: reading theory at school does not make you ready to operate overnight. But the knowledge builds confidence, the confidence makes you dare to practise, and the practice eventually leads to the operating table. The same question holds for investors: does knowledge act on risk directly, or through confidence? Scroll on, and we measure it.","conclusion_eyebrow":"Part 4 · Conclusion","conclusion_h":"Knowledge shapes the quality of risk","conclusion_b":"Financial literacy does not blindly push you toward more risk. It appears to produce more informed, better-calibrated risk, and the route there runs through confidence. For financial education: do not just pile on facts, help people judge their own knowledge accurately.","conclusion_caveat":"Remember: this is a snapshot (not cause), a skewed sample, and knowledge near the ceiling. The findings describe investor-Norway, not necessarily everyone.","quiz_eyebrow":"Part 3 · Method","quiz_h":"Try it yourself before we tell you","quiz_prompt":"How many of these do you think you would get right? Guess first, then take a shot.","quiz_guesslabel":"My guess (0–6):","q1_q":"You put 100 kr in an account at 6% interest. How much do you have after two years, with no withdrawals?","q1_o0":"106 kr","q1_o1":"112 kr","q1_o2":"112,36 kr","q1_o3":"130 kr","q2_q":"A stock falls 50%. How much must it rise the next year to get back to where it started?","q2_o0":"50%","q2_o1":"75%","q2_o2":"100%","quiz_reveal":"The average investor in the survey got 5,63 out of 6. Knowledge was high, keep that in mind, it matters in a moment.","qOk":"Correct!","qNo":"Not quite, the right answer is marked.","ct_eyebrow":"Part 3 · Method","ct_h":"How well do you know yourself?","ct_intro":"Answer three questions, and say how sure you are of each. At the end we measure your own overconfidence gap, just like in the thesis.","ct_q1":"You put 100 kr in an account at 6% interest. How much do you have after two years, with no withdrawals?","ct_q1_o0":"106 kr","ct_q1_o1":"112 kr","ct_q1_o2":"112,36 kr","ct_q1_o3":"130 kr","ct_q2":"A stock falls 50%. How much must it rise the next year to get back to where it started?","ct_q2_o0":"50%","ct_q2_o1":"75%","ct_q2_o2":"100%","ct_q3":"Your account pays 1% interest and inflation is 3%. How does your purchasing power change over one year?","ct_q3_o0":"It rises","ct_q3_o1":"It falls","ct_q3_o2":"It is unchanged","ct_conflbl":"How sure?","ct_conf0":"Guessing","ct_conf1":"Fairly sure","ct_conf2":"Certain","ct_go":"Show the result","ct_score":"You got right","ct_conf":"Your average confidence","ct_gap":"Your overconfidence gap","ct_over":"You are overconfident: belief runs ahead of knowledge.","ct_under":"You are modest: you know more than you think.","ct_cal":"You are well calibrated: belief matches knowledge.","ct_tie":"The average investor in the study was overconfident, but the gap shrank with knowledge. That is exactly what H4 measures.","outro_h":"Thanks for reading","outro_b":"A master’s thesis in finance, made readable for everyone. Want the full version? You will find it here.","outro_acad":"«How does financial literacy – or lack thereof – influence risk-taking behaviour, overconfidence and portfolio construction among Norwegian investors?»","outro_authors":"Henrik Bekkevold and Valiant Evers · MSc Finance · BI Norwegian Business School · 2026","outro_pdf":"Download the thesis (PDF)","outro_back":"Back to projects","foot":"© 2026 Henrik Bekkevold & Valiant Evers","figt_growth":"Growth: more private shareholders","figl_0":"private shareholders in Norway, 2025","figt_funnel":"Cleaning","figl_1":"Reddit","figl_2":"Shareville (now Nordnet Social)","figl_3":"Facebook","figl_4":"respondents","figl_5":"Failed attention check","figl_6":"Under 18 years","figl_7":"Incomplete answers","figl_8":"analysis base","figt_ceiling":"The knowledge ceiling","figl_9":"number of respondents (N = 750)","figl_10":"KNOWLEDGE SCORE (0 TO 6 CORRECT)","figl_11":"mean 5,63","figl_12":"scored full marks (553 of 750)","figt_calib":"Calibration","figl_13":"low","figl_14":"KNOWLEDGE","figl_15":"high","figl_16":"OVERCONFIDENCE GAP","figl_17":"gap = 0 : perfect calibration","figl_18":"above the line: overconfident","figl_19":"below the line: modest","figt_mediation":"Knowledge → Confidence → Risk","figl_20":"Knowledge","figl_21":"Confidence","figl_22":"Risk","figl_23":"of the relationship via confidence","figt_findings3":"Three findings, one picture","figl_24":"Spread their money a little wider","figl_25":"Take a little more risk","figl_26":"(the finding is fragile)","figl_27":"Know themselves much better","figl_28":"clearly the strongest finding"}};
 var lang='no'; try{var s=localStorage.getItem('ve-thesis-lang'); if(s&&I18N[s])lang=s;}catch(e){}

 function buildCaps(){
   document.querySelectorAll('[data-caps]').forEach(function(box){
     var key=box.getAttribute('data-caps'), caps=(window.__CAPS[key]||{})[lang]||[];
     box.innerHTML=caps.map(function(c){return '<div class="cap" data-from="'+c.from+'">'+c.html+'</div>';}).join('');
   });
 }
 function applyLang(){
   var d=I18N[lang]; document.documentElement.lang=lang;
   document.title=d.hero_h+' \u00b7 Masteroppgave';
   document.querySelectorAll('[data-i18n]').forEach(function(el){var k=el.getAttribute('data-i18n'); if(d[k]!==undefined) el.innerHTML=d[k];});
   document.getElementById('langNo').classList.toggle('active',lang==='no');
   document.getElementById('langEn').classList.toggle('active',lang==='en');
   document.querySelectorAll('.q.answered .verdict').forEach(function(v){v.textContent=v.getAttribute('data-ok')==='1'?d.qOk:d.qNo;});
   buildCaps();
 }
 function setLang(l){lang=l; try{localStorage.setItem('ve-thesis-lang',l)}catch(e){} applyLang();}
 document.getElementById('langNo').addEventListener('click',function(){setLang('no')});
 document.getElementById('langEn').addEventListener('click',function(){setLang('en')});

 /* progress bar + left rail */
 var bar=document.getElementById('progressBar');
 var rail=document.getElementById('railMarks'), railFill=document.getElementById('railFill');
 var parts=['Motivasjon','Teori','Metode','Resultater'], marks=[];
 parts.forEach(function(name,i){
   var top=(i/(parts.length-1))*100;
   var m=document.createElement('div'); m.className='rail__mark'; m.style.top=top+'%';
   var l=document.createElement('div'); l.className='rail__lbl'; l.style.top=top+'%'; l.textContent=name;
   rail.appendChild(m); rail.appendChild(l); marks.push(m);
 });
 var curPart=1;
 function railUpdate(){
   var h=document.documentElement, max=h.scrollHeight-h.clientHeight, pr=max>0?clamp(h.scrollTop/max,0,1):0;
   if(bar) bar.style.transform='scaleX('+pr.toFixed(4)+')';
   if(railFill) railFill.style.height=pr*100+'%';
   marks.forEach(function(m,i){m.classList.toggle('on', (i+1)===curPart);});
 }

 /* editorial reveals + part tracking */
 var io=new IntersectionObserver(function(es){es.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add('in'); var pt=e.target.getAttribute('data-part'); if(pt){curPart=parseInt(pt,10); railUpdate();} } });},{threshold:0.25});
 document.querySelectorAll('.reveal,[data-part]').forEach(function(el){io.observe(el);});

 /* figure scrolly scenes: scrub progress -> apply fn + caption switch */
 var scenes=[].slice.call(document.querySelectorAll('.scrolly[data-fig]')).map(function(sec){
   return {sec:sec, key:sec.getAttribute('data-fig'), fn:window.__FIGFNS[sec.getAttribute('data-fig')],
           caps:sec.querySelector('[data-caps]'), cur:0, on:false};
 });
 function sceneProgress(sec){var total=sec.offsetHeight-window.innerHeight; var sc=clamp(-sec.getBoundingClientRect().top,0,total); return total>0?sc/total:0;}
 function applyCaps(sc,p){
   var caps=sc.caps?sc.caps.querySelectorAll('.cap'):[]; if(!caps.length)return;
   var a=0; for(var i=0;i<caps.length;i++){ if(p>=parseFloat(caps[i].getAttribute('data-from')))a=i; }
   for(var j=0;j<caps.length;j++) caps[j].classList.toggle('on',j===a);
 }
 function renderScene(sc,p){ try{ if(sc.fn) sc.fn(p); }catch(e){} applyCaps(sc,p); }

 if(reduce){ scenes.forEach(function(sc){renderScene(sc,1);}); applyLang(); railUpdate(); return; }

 var running=false;
 var sio=new IntersectionObserver(function(es){es.forEach(function(e){ var sc=scenes.filter(function(s){return s.sec===e.target;})[0]; if(sc)sc.on=e.isIntersecting; }); start();},{rootMargin:'200px 0px'});
 scenes.forEach(function(sc){sio.observe(sc.sec);});
 function tick(){
   var any=false;
   for(var i=0;i<scenes.length;i++){var sc=scenes[i]; if(!sc.on)continue; any=true;
     var tgt=sceneProgress(sc.sec); sc.cur+=(tgt-sc.cur)*0.14; if(Math.abs(tgt-sc.cur)<0.0004)sc.cur=tgt; renderScene(sc,sc.cur);}
   railUpdate();
   if(any){requestAnimationFrame(tick);} else {running=false;}
 }
 function start(){ if(running)return; if(!scenes.some(function(s){return s.on;}))return; running=true; requestAnimationFrame(tick); }
 window.addEventListener('scroll',railUpdate,{passive:true});
 document.addEventListener('visibilitychange',function(){ if(!document.hidden) start(); });

 /* quiz */
 var gr=document.getElementById('guessRange'), gv=document.getElementById('guessVal');
 if(gr) gr.addEventListener('input',function(){gv.textContent=gr.value;});
 document.querySelectorAll('.q').forEach(function(q){
   var correct=parseInt(q.getAttribute('data-correct'),10), opts=q.querySelectorAll('.opt'), verdict=q.querySelector('.verdict');
   opts.forEach(function(opt,idx){opt.addEventListener('click',function(){
     if(q.classList.contains('answered'))return; q.classList.add('answered'); opts[correct].classList.add('correct');
     var ok=idx===correct; if(!ok)opt.classList.add('wrong'); verdict.classList.add(ok?'ok':'no'); verdict.setAttribute('data-ok',ok?'1':'0');
     verdict.textContent=ok?I18N[lang].qOk:I18N[lang].qNo; var rn=document.getElementById('quizReveal'); if(rn)rn.classList.add('show');
   });});
 });

 /* calibration test: answer + confidence -> personal overconfidence gap */
 (function(){
   var test=document.getElementById('ctest'); if(!test) return;
   var qs=[].slice.call(test.querySelectorAll('.ctq'));
   var stt=qs.map(function(){return {opt:null,conf:null};});
   var go=document.getElementById('ctestGo');
   function check(){ go.disabled=!stt.every(function(s){return s.opt!=null&&s.conf!=null;}); }
   qs.forEach(function(q,qi){
     q.querySelectorAll('.ctopt').forEach(function(o,oi){ o.addEventListener('click',function(){ if(q.classList.contains('done'))return; stt[qi].opt=oi; q.querySelectorAll('.ctopt').forEach(function(x){x.classList.remove('sel');}); o.classList.add('sel'); check(); }); });
     q.querySelectorAll('.ctc').forEach(function(c){ c.addEventListener('click',function(){ if(q.classList.contains('done'))return; stt[qi].conf=parseInt(c.getAttribute('data-c'),10); q.querySelectorAll('.ctc').forEach(function(x){x.classList.remove('sel');}); c.classList.add('sel'); check(); }); });
   });
   go.addEventListener('click',function(){
     var correct=0, confSum=0;
     qs.forEach(function(q,qi){ q.classList.add('done'); var cor=parseInt(q.getAttribute('data-correct'),10), opts=q.querySelectorAll('.ctopt'); opts[cor].classList.add('correct'); if(stt[qi].opt!==cor){opts[stt[qi].opt].classList.add('wrong');} else {correct++;} confSum+=stt[qi].conf; });
     var n=qs.length, actual=Math.round(correct/n*100), conf=Math.round(confSum/n), gap=conf-actual, d=I18N[lang];
     var v=gap>12?d.ct_over:gap<-12?d.ct_under:d.ct_cal, vc=gap>12?'tag-conf':gap<-12?'tag-know':'tag-good';
     var r=document.getElementById('ctestResult'); r.hidden=false;
     r.innerHTML='<div class="ctr__row"><span>'+d.ct_score+'</span><b>'+correct+' / '+n+'</b></div><div class="ctr__row"><span>'+d.ct_conf+'</span><b>'+conf+' %</b></div><div class="ctr__gap"><span>'+d.ct_gap+'</span><b class="'+vc+'">'+(gap>0?'+':'')+gap+'</b></div><div class="ctr__verdict '+vc+'">'+v+'</div><p class="ctr__tie">'+d.ct_tie+'</p>';
     go.style.display='none';
   });
 })();

 applyLang(); railUpdate(); start();
 setTimeout(function(){scenes.forEach(function(sc){renderScene(sc,sceneProgress(sc.sec));});},60);
})();
