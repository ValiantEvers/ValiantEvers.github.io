<style>
:root{
  --bg:#0a0e1a; --bg2:#0e1424; --text:#e7ecff; --muted:rgba(231,236,255,.6);
  --accent:#6996ff; --accent2:#aabeff; --accent-deep:#3f6fe0;
  --warm:#ffb774; --good:#5fd0a0; --bad:#ff7b7b;
  --card:#141d33; --card2:#18223c; --line:rgba(231,236,255,.10);
  --shadow:0 20px 60px rgba(0,0,0,.45);
  --maxw:780px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.65;overflow-x:hidden}
img,svg{max-width:100%}
h1,h2,h3{font-family:'Syne',sans-serif;line-height:1.08;letter-spacing:-.02em}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Ambient backdrop */
.backdrop{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.glow{position:absolute;border-radius:50%;filter:blur(90px);opacity:.30}
.glow.g1{width:50vw;height:50vw;background:var(--accent-deep);top:-12%;left:-10%}
.glow.g2{width:42vw;height:42vw;background:#6a4fd0;bottom:-10%;right:-8%}
.glow.g3{width:32vw;height:32vw;background:#1f8f6a;top:45%;left:55%;opacity:.16}
body::after{content:'';position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.03;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");background-size:200px}

/* Top progress bar */
.progress{position:fixed;top:0;left:0;height:3px;width:100%;z-index:60;background:transparent}
.progress span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .12s linear}

/* Top bar: part label + language switch */
.topbar{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;justify-content:space-between;align-items:center;padding:1rem 1.4rem;pointer-events:none}
.part-pill{pointer-events:auto;background:rgba(20,29,51,.6);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:999px;padding:.4rem .9rem;font-size:.72rem;font-weight:600;letter-spacing:.04em;color:var(--accent2);opacity:0;transform:translateY(-6px);transition:opacity .4s,transform .4s}
.part-pill.show{opacity:1;transform:translateY(0)}
.lang{pointer-events:auto;display:flex;gap:2px;background:rgba(20,29,51,.6);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:999px;padding:3px}
.lang button{background:none;border:none;color:var(--muted);font-family:'Syne',sans-serif;font-weight:700;font-size:.74rem;letter-spacing:.06em;padding:.34rem .66rem;border-radius:999px;cursor:pointer;transition:all .25s}
.lang button.active{background:var(--accent);color:#06122e}
.lang button:not(.active):hover{color:var(--text)}

/* Hero */
.hero{position:relative;z-index:2;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:6rem 1.4rem 4rem}
.hero .eyebrow{font-size:.78rem;font-weight:600;letter-spacing:.32em;text-transform:uppercase;color:var(--accent2);margin-bottom:1.4rem;opacity:0;animation:rise .8s .1s forwards}
.hero h1{font-size:clamp(2.4rem,8vw,5rem);font-weight:800;max-width:14ch;margin-bottom:1.3rem;background:linear-gradient(180deg,#fff,#bcd0ff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;opacity:0;animation:rise .9s .25s forwards}
.hero .sub{font-size:clamp(1rem,2.4vw,1.25rem);color:var(--muted);max-width:36ch;opacity:0;animation:rise .9s .45s forwards}
.scroll-hint{margin-top:3.2rem;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);opacity:0;animation:rise .9s .7s forwards;display:flex;flex-direction:column;align-items:center;gap:.6rem}
.scroll-hint .arrow{width:22px;height:22px;border-right:2px solid var(--accent);border-bottom:2px solid var(--accent);transform:rotate(45deg);animation:bob 1.8s ease-in-out infinite}
@keyframes rise{to{opacity:1;transform:translateY(0)}}
@keyframes bob{0%,100%{transform:rotate(45deg) translate(0,0)}50%{transform:rotate(45deg) translate(4px,4px)}}
.hero .eyebrow,.hero h1,.hero .sub{transform:translateY(18px)}

/* Scenes */
main{position:relative;z-index:2}
.scene{max-width:var(--maxw);margin:0 auto;padding:7rem 1.4rem;min-height:88svh;display:flex;flex-direction:column;justify-content:center}
.scene .eyebrow{font-size:.72rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin-bottom:1.1rem}
.scene h2{font-size:clamp(1.7rem,4.3vw,2.6rem);font-weight:800;margin-bottom:1.1rem}
.scene .body{font-size:clamp(1.04rem,2.2vw,1.18rem);color:#d4ddf7}
.scene .body + .body{margin-top:1rem}
.highlight{margin-top:1.3rem;padding:1.1rem 1.25rem;border-left:3px solid var(--accent);background:rgba(105,150,255,.08);border-radius:0 12px 12px 0;font-size:1.02rem;color:#e8eeff}
.fig{margin:0 0 2.4rem;width:100%}
.caveat{margin-top:1.4rem;font-size:.92rem;color:var(--muted);border-top:1px solid var(--line);padding-top:1rem}

/* reveal-on-scroll */
.reveal{opacity:0;transform:translateY(34px);transition:opacity .8s cubic-bezier(.2,.7,.2,1),transform .8s cubic-bezier(.2,.7,.2,1)}
.scene.in .reveal{opacity:1;transform:none}
.scene.in .reveal.d1{transition-delay:.12s}
.scene.in .reveal.d2{transition-delay:.24s}
.scene.in .reveal.d3{transition-delay:.36s}

/* Figure primitives */
.figbox{background:linear-gradient(160deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:20px;padding:1.6rem;box-shadow:var(--shadow)}
.fig svg{display:block;width:100%;height:auto}
.fig-cap{margin-top:.7rem;font-size:.8rem;color:var(--muted);text-align:center}

/* counters */
.counter{font-family:'Syne',sans-serif;font-weight:800;font-variant-numeric:tabular-nums}

/* Meters (vertical bars) */
.meters{display:flex;gap:2.4rem;justify-content:center;align-items:flex-end;height:230px}
.meter{display:flex;flex-direction:column;align-items:center;gap:.6rem;width:84px}
.meter .bar{width:46px;height:170px;background:rgba(231,236,255,.07);border-radius:10px;position:relative;overflow:hidden;display:flex;align-items:flex-end}
.meter .fill{width:100%;height:0;border-radius:10px;transition:height 1.1s cubic-bezier(.2,.8,.2,1)}
.meter.know .fill{background:linear-gradient(180deg,var(--accent2),var(--accent))}
.meter.conf .fill{background:linear-gradient(180deg,#ffd6a8,var(--warm))}
.meter .lbl{font-size:.82rem;font-weight:600;color:var(--muted);text-align:center}

/* dots */
.dotwrap{position:relative}

/* quiz */
.quiz{display:flex;flex-direction:column;gap:1rem}
.guess{background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:1.2rem 1.3rem}
.guess label{display:block;font-weight:600;margin-bottom:.8rem}
.guess .row{display:flex;align-items:center;gap:1rem}
.guess input[type=range]{flex:1;accent-color:var(--accent);height:6px}
.guess .gval{font-family:'Syne',sans-serif;font-weight:800;font-size:1.5rem;color:var(--accent2);min-width:1.4ch;text-align:center}
.q{background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:1.2rem 1.3rem}
.q .qtext{font-weight:600;margin-bottom:.9rem}
.opts{display:flex;flex-direction:column;gap:.55rem}
.opt{text-align:left;background:rgba(231,236,255,.04);border:1px solid var(--line);color:var(--text);padding:.7rem .9rem;border-radius:10px;cursor:pointer;font:inherit;font-size:.98rem;transition:border-color .2s,background .2s,transform .1s}
.opt:hover{border-color:var(--accent);background:rgba(105,150,255,.08)}
.opt:active{transform:scale(.99)}
.opt.correct{border-color:var(--good);background:rgba(95,208,160,.16);color:#dafff0}
.opt.wrong{border-color:var(--bad);background:rgba(255,123,123,.14)}
.opt .mark{float:right;font-weight:700}
.q.answered .opt:not(.correct):not(.wrong){opacity:.55}
.verdict{margin-top:.7rem;font-size:.9rem;font-weight:600}
.verdict.ok{color:var(--good)}.verdict.no{color:var(--bad)}
.reveal-note{background:rgba(105,150,255,.08);border:1px solid var(--line);border-radius:14px;padding:1.1rem 1.2rem;font-size:1rem;color:#e8eeff;display:none}
.reveal-note.show{display:block;animation:rise .6s forwards}
.expand-btn{align-self:flex-start;background:none;border:1px solid var(--accent);color:var(--accent2);font:inherit;font-weight:600;padding:.6rem 1.1rem;border-radius:999px;cursor:pointer;transition:all .2s}
.expand-btn:hover{background:var(--accent);color:#06122e}
.more-q{display:none;flex-direction:column;gap:1rem}
.more-q.show{display:flex;animation:rise .5s forwards}

/* generic small button */
.mini-btn{background:none;border:1px solid var(--line);color:var(--accent2);font:inherit;font-weight:600;font-size:.86rem;padding:.5rem .9rem;border-radius:999px;cursor:pointer;transition:all .2s;margin-top:1rem}
.mini-btn:hover{border-color:var(--accent);color:var(--text)}

/* outro */
.outro{max-width:var(--maxw);margin:0 auto;padding:6rem 1.4rem 8rem;text-align:center}
.outro h2{font-size:clamp(1.8rem,4.5vw,2.6rem);margin-bottom:1rem}
.outro .body{color:var(--muted);max-width:42ch;margin:0 auto 2rem}
.acad{margin:2rem auto;max-width:46ch;font-size:.92rem;color:var(--muted);font-style:italic;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:1.2rem 0}
.authors{font-family:'Syne',sans-serif;font-weight:700;color:var(--text);margin-bottom:2rem}
.btn-row{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:.5rem;font-family:'Syne',sans-serif;font-weight:700;font-size:.9rem;text-decoration:none;padding:.85rem 1.5rem;border-radius:999px;transition:transform .25s,box-shadow .25s}
.btn-primary{background:var(--accent);color:#06122e;box-shadow:0 8px 24px rgba(105,150,255,.3)}
.btn-primary:hover{transform:translateY(-3px)}
.btn-ghost{border:1px solid var(--line);color:var(--text)}
.btn-ghost:hover{border-color:var(--accent)}
.foot{max-width:var(--maxw);margin:0 auto;padding:0 1.4rem 3rem;text-align:center;font-size:.78rem;color:rgba(231,236,255,.32)}
.foot a{color:rgba(231,236,255,.5)}

/* domino */
.domino-stage{height:200px;position:relative}
.tile{transform-box:fill-box;transform-origin:bottom center;transition:transform .42s cubic-bezier(.5,.02,.35,1)}
.node-lbl{text-transform:uppercase;letter-spacing:.05em}
.med-arrow{transition:stroke .4s ease,opacity .4s ease}
.dot-fade{transition:opacity .6s ease}
.flow-dash{stroke-dasharray:6 6;animation:dash 1.4s linear infinite}
@keyframes dash{to{stroke-dashoffset:-24}}

/* ruler trendline wobble */
.wobble{animation:wob 2.6s ease-in-out infinite}
@keyframes wob{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(5deg)}}

@media (max-width:600px){
  .scene{padding:5rem 1.2rem;min-height:auto}
  .figbox{padding:1.1rem}
  .meters{gap:1.4rem;height:200px}
  .meter .bar{height:150px}
}

/* reduced motion */
@media (prefers-reduced-motion:reduce){
  *{animation:none !important;scroll-behavior:auto !important}
  .reveal{opacity:1 !important;transform:none !important;transition:none !important}
  .meter .fill,.tile{transition:none !important}
  .hero .eyebrow,.hero h1,.hero .sub,.scroll-hint{opacity:1 !important;transform:none !important}
}
</style>
</head>
<body>
<div class="backdrop"><div class="glow g1"></div><div class="glow g2"></div><div class="glow g3"></div></div>
<div class="progress"><span id="progressBar"></span></div>

<div class="topbar">
  <div class="part-pill" id="partPill" data-i18n="partPill"></div>
  <div class="lang" role="group" aria-label="Language">
    <button id="langNo" class="active" data-lang="no">NO</button>
    <button id="langEn" data-lang="en">EN</button>
  </div>
</div>

<!-- SCENE 0 — HERO -->

<main>

<!-- ============ DEL 1 — MOTIVASJON ============ -->

<!-- SCENE 1 -->

<!-- SCENE 2 -->
<section class="scene" data-part="1">
  <div class="fig reveal d1">
    <div class="figbox">
      <svg viewBox="0 0 600 200" id="dotsSvg" role="img" aria-hidden="true"></svg>
    </div>
  </div>
  <h2 class="reveal d1" data-i18n="s2_h"></h2>
  <p class="body reveal d2" data-i18n="s2_b"></p>
</section>

<!-- SCENE 3 -->
<section class="scene" data-part="1">
  <div class="fig reveal d1">
    <div class="figbox">
      <svg viewBox="0 0 600 220" role="img" aria-hidden="true">
        <line x1="300" y1="120" x2="300" y2="210" stroke="rgba(231,236,255,.2)" stroke-width="6" stroke-linecap="round"/>

  </div>
  <h2 class="reveal d1" data-i18n="s3_h"></h2>
  <p class="body reveal d2" data-i18n="s3_b"></p>
</section>

<!-- SCENE 4 -->
<section class="scene" data-part="1">
  <div class="fig reveal d1">
    <div class="figbox">
      <svg viewBox="0 0 600 150" role="img" aria-hidden="true">
        <!-- basket (all eggs one) -->
        <g transform="translate(70,30)">
          <path d="M10,40 Q60,90 110,40" fill="none" stroke="#6996ff" stroke-width="3"/>

        </g>
        <!-- risk meter -->
        <g transform="translate(430,30)">
          <path d="M20,60 A50,50 0 0,1 120,60" fill="none" stroke="rgba(231,236,255,.18)" stroke-width="8" stroke-linecap="round"/>
          <path d="M20,60 A50,50 0 0,1 110,35" fill="none" stroke="#ff7b7b" stroke-width="8" stroke-linecap="round"/>

          <text x="70" y="105" text-anchor="middle" fill="#8f9bbf" fill-opacity=".7" font-size="13" font-family="Outfit" data-i18n="lblRiskMeter"></text>

  </div>
  <h2 class="reveal d1" data-i18n="s4_h"></h2>
  <p class="body reveal d2" data-i18n="s4_b"></p>
</section>

<!-- ============ DEL 2 — TEORI ============ -->

<!-- SCENE 5 -->
<section class="scene" data-part="2">
  <div class="eyebrow reveal" data-i18n="part2"></div>
  <div class="fig reveal d1">
    <div class="figbox">
      <div class="meters">
        <div class="meter know"><div class="bar"><div class="fill" data-fill="78%"></div></div><div class="lbl" data-i18n="lblKnow"></div></div>

  <p class="body reveal d2" data-i18n="s5_b"></p>
</section>

<!-- SCENE 6 -->
<section class="scene" data-part="2">
  <div class="fig reveal d1">
    <div class="figbox">
      <svg viewBox="0 0 600 170" role="img" aria-hidden="true">

        <text x="430" y="70" text-anchor="middle" fill="#d4ddf7" font-size="15" font-family="Outfit" data-i18n="lblSpeedoNote1"></text>
        <text x="430" y="96" text-anchor="middle" fill="#8f9bbf" font-size="13" font-family="Outfit" data-i18n="lblSpeedoNote2"></text>
      </svg>

  </div>
  <h2 class="reveal d1" data-i18n="s6_h"></h2>
  <p class="body reveal d2" data-i18n="s6_b"></p>
</section>

<!-- SCENE 7 -->
<section class="scene" data-part="2">
  <div class="fig reveal d1">

  s5_h:"Building block 1: What you actually know",

  s6_h:"Building block 2: What you THINK you know",
  s6_b:"Confidence and calibration are two different things. Confidence is how good you think you are. Calibration is how well that belief matches reality. You can be both highly confident and well-calibrated — if you genuinely are good. Like a driver certain he drives better than everyone else: the question is whether his speedometer reads true.",

  s8_b:"Two more, in plain terms: Risk tolerance is how much swing and possible loss you'll stomach for a shot at higher returns — like how steep a rollercoaster you dare to ride. Diversification is not putting all your eggs in one basket.",

var lang = 'no';
try{ var s = localStorage.getItem('ve-thesis-lang'); if(s && I18N[s]) lang = s; }catch(e){}

function fmtInt(n){ var str = Math.round(n).toString();
  var sep = (lang==='no') ? ' ' : ',';
  return str.replace(/\B(?=(\d{3})+(?!\d))/g, sep);
}

function applyLang(){
  var dict = I18N[lang];
  document.documentElement.lang = (lang==='en') ? 'en' : 'no';
  document.querySelectorAll('[data-i18n]').forEach(function(el){
    var k = el.getAttribute('data-i18n');
    if(dict[k] !== undefined) el.innerHTML = dict[k];
  });
  document.getElementById('langNo').classList.toggle('active', lang==='no');
  document.getElementById('langEn').classList.toggle('active', lang==='en');
  // re-render dynamic counters that already finished
  document.querySelectorAll('.counter[data-done]').forEach(function(el){
    el.textContent = fmtInt(parseFloat(el.getAttribute('data-target')));
  });
  // re-render verdict text on answered questions
  document.querySelectorAll('.q.answered .verdict').forEach(function(v){
    var ok = v.getAttribute('data-ok')==='1';
    v.textContent = ok ? dict.qOk : dict.qNo;
  });
  // part pill reflects current part
  updatePartPill();
}

function setLang(l){ lang=l; try{localStorage.setItem('ve-thesis-lang',l)}catch(e){} applyLang(); }
document.getElementById('langNo').addEventListener('click',function(){setLang('no')});
document.getElementById('langEn').addEventListener('click',function(){setLang('en')});

/* ---------------- progress bar + part pill ---------------- */
var bar = document.getElementById('progressBar');
var pill = document.getElementById('partPill');
var currentPart = 1;
function updatePartPill(){
  var names = [I18N[lang].part1,I18N[lang].part2,I18N[lang].part3,I18N[lang].part4];
  // partPill key not used directly; build "Part n · Name"
  var label = (lang==='no'?'Del ':'Part ')+currentPart+(lang==='no'?' av 4 · ':' of 4 · ')+
    names[currentPart-1].split('· ')[1];
  pill.textContent = label;
}
function onScroll(){
  var h = document.documentElement;
  var max = h.scrollHeight - h.clientHeight;
  var p = max>0 ? (h.scrollTop || document.body.scrollTop)/max : 0;
  bar.style.width = (p*100).toFixed(2)+'%';
  pill.classList.toggle('show', (h.scrollTop||document.body.scrollTop) > 300);
}
window.addEventListener('scroll', onScroll, {passive:true});

/* ---------------- reveal + per-scene triggers ---------------- */
var prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function animateCounter(el){
  if(el.getAttribute('data-done')) return;
  var target = parseFloat(el.getAttribute('data-target'));
  var from = parseFloat(el.getAttribute('data-from')||'0');
  el.setAttribute('data-done','1');
  if(prefersReduced){ el.textContent = fmtInt(target); return; }
  var dur=1400, t0=null;
  function step(ts){ if(!t0)t0=ts; var k=Math.min((ts-t0)/dur,1);
    var eased = 1-Math.pow(1-k,3);
    el.textContent = fmtInt(from + (target-from)*eased);
    if(k<1) requestAnimationFrame(step); else el.textContent=fmtInt(target);
  }
  requestAnimationFrame(step);
}

function fillMeters(scene){
  scene.querySelectorAll('.meter .fill').forEach(function(f){
    f.style.height = f.getAttribute('data-fill');
  });
}

// scatter dots near right end for ruler (scene14) and risk (scene16)
function buildRulerDots(){
  var g = document.getElementById('rulerDots'); if(!g||g.childNodes.length) return;
  // most dots between x=473(5) and 560(6), few lower
  var pts=[];
  for(var i=0;i<70;i++){ pts.push([560 - Math.random()*90, 110 - Math.random()*70]); } // cluster 5–6
  for(var j=0;j<8;j++){ pts.push([300 + Math.random()*150, 115 - Math.random()*55]); } // sparse 3–5
  pts.forEach(function(p){
    var c=document.createElementNS('http://www.w3.org/2000/svg','circle');
    c.setAttribute('cx',p[0].toFixed(1)); c.setAttribute('cy',p[1].toFixed(1));
    c.setAttribute('r','3.2'); c.setAttribute('fill','#6996ff'); c.setAttribute('opacity','.55');
    g.appendChild(c);
  });
}
// scene 16 dots — SAME styling as scene 14 ruler (r 3.2, #6996ff, .55) so the
// reader recognises it as the same data population seen from another angle.
function buildRiskDots(){
  var g=document.getElementById('riskDots'); if(!g||g.childNodes.length) return;
  function mk(x,y,perfect){
    var c=document.createElementNS('http://www.w3.org/2000/svg','circle');
    c.setAttribute('cx',x.toFixed(1));
    c.setAttribute('data-cy',y.toFixed(1)); // target y (final scatter position)
    c.setAttribute('cy','140');             // start on the x-axis (ruler row); spreads up on view
    c.setAttribute('r','3.2'); c.setAttribute('fill','#6996ff'); c.setAttribute('opacity','.55');
    c.setAttribute('class','dot-fade'+(perfect?' perfect':''));
    g.appendChild(c);
  }
  for(var i=0;i<40;i++){ mk(505+Math.random()*52, 112-Math.random()*72, true); }  // perfect (6/6) cluster, far right
  for(var k=0;k<22;k++){ mk(440+Math.random()*60, 116-Math.random()*64, false); } // 5/6 cluster
  for(var j=0;j<10;j++){ mk(120+Math.random()*300, 122-Math.random()*58, false); } // sparse lower scores
}
// "spread out" the ruler row into the scatter — visually links scene 16 to scene 14
function animateRiskSpread(){
  var g=document.getElementById('riskDots'); if(!g||g.getAttribute('data-spread')) return;
  g.setAttribute('data-spread','1');
  var dots=g.querySelectorAll('circle');
  if(prefersReduced){ dots.forEach(function(c){ c.setAttribute('cy', c.getAttribute('data-cy')); }); return; }
  var t0=null, dur=750;
  function step(ts){ if(!t0)t0=ts; var k=Math.min((ts-t0)/dur,1); var e=1-Math.pow(1-k,3);
    dots.forEach(function(c){ var ty=parseFloat(c.getAttribute('data-cy')); c.setAttribute('cy',(140+(ty-140)*e).toFixed(1)); });
    if(k<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function buildScatterDots(){
  var svg=document.getElementById('dotsSvg'); if(!svg||svg.childNodes.length) return;
  for(var i=0;i<60;i++){
    var x=30+Math.random()*540, y=20+Math.random()*160;
    var bright=Math.random();
    var c=document.createElementNS('http://www.w3.org/2000/svg','circle');
    c.setAttribute('cx',x.toFixed(1)); c.setAttribute('cy',y.toFixed(1));
    c.setAttribute('r','5');
    c.setAttribute('fill', bright>0.5 ? '#aabeff' : '#2c3a5c');
    c.setAttribute('opacity', (0.4+bright*0.6).toFixed(2));
    svg.appendChild(c);
  }
}

function growthLinePlay(){
  var line=document.getElementById('growthLine'), area=document.getElementById('growthArea'), dot=document.getElementById('growthDot');
  if(!line) return;
  if(prefersReduced){ line.style.strokeDashoffset='0'; area.style.opacity='1'; dot.setAttribute('opacity','1'); return; }
  line.style.transition='stroke-dashoffset 1.6s ease'; line.style.strokeDashoffset='0';
  setTimeout(function(){ area.style.transition='opacity .8s'; area.style.opacity='1'; dot.setAttribute('opacity','1'); },700);
}

function eggsPlay(scene){
  var eggs=scene.querySelectorAll('.egg'); if(!eggs.length) return;
  eggs.forEach(function(e,i){ setTimeout(function(){ e.style.transition='opacity .5s'; e.setAttribute('opacity','1'); }, prefersReduced?0:i*160); });
}

/* mediation chain (scene 18): KNOWLEDGE → CONFIDENCE → RISK toppling in sequence,
   indirect path glows + 57% counts up, then the direct path fades in faded/dashed */
var _domTimers=[];
function dominoPlay(){
  var t1=document.getElementById('t1'),t2=document.getElementById('t2'),t3=document.getElementById('t3');
  var a1=document.getElementById('medArrow1'),a2=document.getElementById('medArrow2');
  var wrap=document.getElementById('lbl57wrap'), cnt=document.getElementById('cnt57');
  var dir=document.getElementById('directArrow'), dlbl=document.getElementById('directLbl');
  if(!t1) return;
  var DIM='rgba(231,236,255,.18)', LIT='#5fd0a0';
  _domTimers.forEach(clearTimeout); _domTimers=[];
  function later(fn,ms){ _domTimers.push(setTimeout(fn,ms)); }
  // reset to standing/blank
  [t1,t2,t3].forEach(function(t){t.style.transform='rotate(0deg)';});
  a1.setAttribute('stroke',DIM); a2.setAttribute('stroke',DIM);
  wrap.setAttribute('opacity','0'); cnt.textContent='0';
  dir.setAttribute('opacity','0'); dlbl.setAttribute('opacity','0');
  if(prefersReduced){
    t1.style.transform=t2.style.transform=t3.style.transform='rotate(80deg)';
    a1.setAttribute('stroke',LIT); a2.setAttribute('stroke',LIT);
    wrap.setAttribute('opacity','1'); cnt.textContent='57';
    dir.setAttribute('opacity','.28'); dlbl.setAttribute('opacity','.6');
    return;
  }
  // sequential topple, each tile tipping toward the next node (~400ms apart)
  later(function(){ t1.style.transform='rotate(80deg)'; },250);
  later(function(){ a1.setAttribute('stroke',LIT); wrap.setAttribute('opacity','1'); },560);
  later(function(){ t2.style.transform='rotate(80deg)'; },650);
  later(function(){ a2.setAttribute('stroke',LIT); },960);
  later(function(){ t3.style.transform='rotate(80deg)'; },1050);
  // 57% counts up alongside the chain
  later(function(){
    var c0=null,cd=1100;
    function cstep(ts){ if(!c0)c0=ts; var k=Math.min((ts-c0)/cd,1);
      cnt.textContent=Math.round(57*(1-Math.pow(1-k,3)));
      if(k<1) requestAnimationFrame(cstep); else cnt.textContent='57'; }
    requestAnimationFrame(cstep);
  },560);
  // direct path fades in last, faded and dashed
  later(function(){ dir.setAttribute('opacity','.28'); dlbl.setAttribute('opacity','.6'); },1700);
}

var io = new IntersectionObserver(function(entries){
  entries.forEach(function(en){
    if(!en.isIntersecting) return;
    var sc = en.target;
    sc.classList.add('in');
    var part = sc.getAttribute('data-part');
    if(part){ currentPart = parseInt(part,10); updatePartPill(); }
    // triggers
    if(sc.querySelector('#growthLine')) growthLinePlay();
    sc.querySelectorAll('.counter').forEach(animateCounter);
    if(sc.querySelector('.meter')) setTimeout(function(){fillMeters(sc);}, 200);
    if(sc.querySelector('.egg')) eggsPlay(sc);
    if(sc.querySelector('#riskDots')) animateRiskSpread();
    if(sc.querySelector('#dominoTopple')) dominoPlay();
  });
},{threshold:0.35});
document.querySelectorAll('.scene, .outro').forEach(function(s){ io.observe(s); });

/* build dynamic SVG content up front */
buildScatterDots(); buildRulerDots(); buildRiskDots();

/* ---------------- quiz interactivity ---------------- */
var guessRange=document.getElementById('guessRange'), guessVal=document.getElementById('guessVal');
if(guessRange){ guessRange.addEventListener('input',function(){ guessVal.textContent=guessRange.value; }); }

document.querySelectorAll('.q').forEach(function(q){
  var correct=parseInt(q.getAttribute('data-correct'),10);
  var opts=q.querySelectorAll('.opt');
  var verdict=q.querySelector('.verdict');
  opts.forEach(function(opt,idx){
    opt.addEventListener('click',function(){
      if(q.classList.contains('answered')) return;
      q.classList.add('answered');
      opts[correct].classList.add('correct');
      var ok = idx===correct;
      if(!ok) opt.classList.add('wrong');
      verdict.classList.add(ok?'ok':'no');
      verdict.setAttribute('data-ok', ok?'1':'0');
      verdict.textContent = ok ? I18N[lang].qOk : I18N[lang].qNo;
      // reveal the avg note once any of the first two answered
      document.getElementById('quizReveal').classList.add('show');
    });
  });
});

var expandBtn=document.getElementById('expandQuiz'), moreQ=document.getElementById('moreQ');
if(expandBtn){ expandBtn.addEventListener('click',function(){
  moreQ.classList.toggle('show');
  expandBtn.style.display = moreQ.classList.contains('show') ? 'none' : 'inline-block';
}); }

/* ---------------- scene 16 H3 toggle (remove perfect-scorers) ---------------- */
var toggleH3=document.getElementById('toggleH3'), riskTrend=document.getElementById('riskTrend'), h3annot=document.getElementById('h3annot');
var h3removed=false;
if(toggleH3){ toggleH3.addEventListener('click',function(){
  h3removed=!h3removed;
  riskTrend.style.transition='all .8s ease';
  var perfect=document.querySelectorAll('#riskDots .perfect');
  if(h3removed){
    // fade the 6/6 cluster to ~18% (still visible — reader sees what was removed)
    perfect.forEach(function(c){ c.setAttribute('opacity','.18'); });
    // trend flattens to near-flat, dashed = "too little variation left"
    riskTrend.setAttribute('x1','60'); riskTrend.setAttribute('y1','92'); riskTrend.setAttribute('x2','540'); riskTrend.setAttribute('y2','88');
    riskTrend.setAttribute('stroke','#8a93a8'); riskTrend.setAttribute('stroke-dasharray','7 6');
    h3annot.setAttribute('opacity','1');
    toggleH3.setAttribute('data-i18n','s16_showall'); toggleH3.innerHTML=I18N[lang].s16_showall;
  } else {
    perfect.forEach(function(c){ c.setAttribute('opacity','.55'); });
    riskTrend.setAttribute('x1','60'); riskTrend.setAttribute('y1','120'); riskTrend.setAttribute('x2','540'); riskTrend.setAttribute('y2','58');
    riskTrend.setAttribute('stroke','#6996ff'); riskTrend.removeAttribute('stroke-dasharray');
    h3annot.setAttribute('opacity','0');
    toggleH3.setAttribute('data-i18n','s16_toggle'); toggleH3.innerHTML=I18N[lang].s16_toggle;
  }
}); }

/* ---------------- scene 18 replay ---------------- */
var replay=document.getElementById('replayDomino');
if(replay){ replay.addEventListener('click',dominoPlay); }

/* init */
applyLang();
onScroll();
})();
</script>
