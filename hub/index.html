<!DOCTYPE html>
<html lang="no">
<head>

<style>
/* dashboard/web-template.html — håndredigerbar mal for den ULISTEDE, passord-
   beskyttede web-utgaven av hub-dashbordet (mønster: /unifor, /oslobors).
   scripts/publish_dashboard.py erstatter BLOB-tokenet med kryptert payload
   (PBKDF2-SHA256 + AES-GCM) og skriver <site>/hub/index.html — rediger aldri
   den bakte fila for hånd. Selve dashbordet ligger kryptert i payloaden og
   vises i en iframe (srcdoc) etter opplåsing. Null eksterne forespørsler;
   fonter selvhostes av siten. Passordet finnes ALDRI i denne fila. */
@font-face{font-family:'Newsreader';font-style:normal;font-weight:200 800;font-display:swap;src:url('/fonts/newsreader-latin-standard-normal.woff2') format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Hanken Grotesk';font-style:normal;font-weight:100 900;font-display:swap;src:url('/fonts/hanken-grotesk-latin-wght-normal.woff2') format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}

:root{
  --font-serif:"Newsreader",Georgia,"Times New Roman",serif;
  --font-sans:"Hanken Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,monospace;
  --bg:#fafaf9;--text:#0a0a0a;--muted:#737373;--accent:#0070ed;--accent2:#3b82f6;
  --accent3:#e7e5e4;--accent4:#004eaa;--card-bg:#ffffff;--card-shadow:0 1px 2px rgba(0,0,0,0.04);
  --ease-out:cubic-bezier(0.23,1,0.32,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font-sans);line-height:1.6;
  display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:20px 26px}
.logo{font-family:var(--font-serif);font-weight:800;font-size:1.5rem;color:var(--accent);text-decoration:none}
.topbar span{font-family:var(--font-mono);font-size:.72rem;color:var(--muted);letter-spacing:1px}
main{flex:1;display:flex;align-items:center;justify-content:center;padding:24px}
.card{background:var(--card-bg);border:1px solid var(--accent3);border-radius:20px;
  box-shadow:var(--card-shadow);padding:42px 40px;max-width:480px;width:100%;
  opacity:0;transform:translateY(8px);animation:reveal 200ms var(--ease-out) forwards}
@keyframes reveal{to{opacity:1;transform:none}}
.section-label{display:inline-block;font-family:var(--font-mono);font-size:.72rem;text-transform:uppercase;
  letter-spacing:3px;font-weight:600;background:linear-gradient(90deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:12px}
h1{font-family:var(--font-serif);font-optical-sizing:auto;font-weight:600;font-size:1.9rem;
  letter-spacing:-.01em;margin-bottom:10px}
p.lead{color:var(--muted);font-size:.95rem;margin-bottom:22px}
.pwrow{display:flex;gap:10px}
input[type=password]{flex:1;font:inherit;font-size:1rem;padding:.75rem 1rem;border:1.5px solid var(--accent3);
  border-radius:12px;background:var(--bg);color:var(--text);outline:none;min-width:0;
  transition:border-color 160ms ease}
input[type=password]:focus{border-color:var(--accent2)}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:.75rem 1.4rem;
  border-radius:50px;font-family:var(--font-sans);font-weight:600;font-size:.95rem;border:none;cursor:pointer;
  background:linear-gradient(135deg,var(--accent),var(--accent4));color:#fff;
  transition:transform 160ms var(--ease-out)}
.btn:active{transform:scale(0.97)}
.btn[disabled]{opacity:.6;cursor:wait}
.err{color:#b3261e;font-size:.85rem;margin-top:10px;min-height:1.2em}
.remember{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:.85rem;
  color:var(--muted);cursor:pointer;user-select:none}
.remember input{accent-color:var(--accent)}
footer{text-align:center;padding:18px;font-family:var(--font-mono);font-size:.68rem;
  letter-spacing:.5px;color:var(--muted)}
#viewer{position:fixed;inset:0;background:#0a0c10;display:flex;flex-direction:column;z-index:100}
.vbar{display:flex;align-items:center;gap:14px;padding:8px 14px;background:#12151c;
  border-bottom:1px solid rgba(255,255,255,.08)}
.vback{font:600 .82rem var(--font-sans);color:#e8ecf4;background:transparent;
  border:1px solid rgba(255,255,255,.2);border-radius:50px;padding:.35rem .9rem;cursor:pointer}
.vback:active{transform:scale(.97)}
.vtitle{font-family:var(--font-mono);font-size:.72rem;color:rgba(232,236,244,.55);letter-spacing:1px}
.vframe{flex:1;border:0;width:100%}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
</style>
</head>
<body>
<div class="topbar"><a class="logo" href="/">Valiant Evers</a><span>PRIVAT</span></div>
<main>
  <div class="card" id="lock">
    <span class="section-label">Privat</span>
    <h1>hub</h1>
    <p class="lead">Passordbeskyttet side. Innholdet ligger kryptert i selve
    fila og låses opp lokalt i nettleseren — ingenting sendes noe sted.</p>
    <form id="form">
      <div class="pwrow">
        <input type="password" id="pw" autocomplete="current-password" autofocus aria-label="Passord">
        <button class="btn" type="submit">Lås opp</button>
      </div>
      <label class="remember"><input type="checkbox" id="rem"> Husk på denne enheten
        (til du trykker Lås)</label>
      <div class="err" id="err"></div>
    </form>
  </div>
</main>
<footer>evers.no · kryptert i ro og i bruk · ingen eksterne kall</footer>

<script>
"use strict";
const B = JSON.parse(document.getElementById('blob').textContent);
const $ = id => document.getElementById(id);
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
let KEY = null;

// Normalisering — MÅ speile publish_dashboard.py: trim → lowercase → NFC →
// apostrof-varianter (iOS «smart punctuation» gjør ' om til ’) → '.
function norm(pw){
  return pw.trim().toLowerCase().normalize('NFC').replace(/[‘’‛`´]/g, "'");
}
async function deriveKey(pw){
  const mat = await crypto.subtle.importKey('raw', new TextEncoder().encode(norm(pw)), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    {name:'PBKDF2', salt: b64(B.salt), iterations: B.iter, hash:'SHA-256'},
    mat, {name:'AES-GCM', length:256}, true, ['decrypt']);
}
async function dec(key, p){
  const buf = await crypto.subtle.decrypt({name:'AES-GCM', iv: b64(p.iv)}, key, b64(p.ct));
  return new TextDecoder().decode(buf);
}
async function visDash(key){
  const html = await dec(key, B.dash);
  const o = document.createElement('div'); o.id = 'viewer';
  const bar = document.createElement('div'); bar.className = 'vbar';
  const laas = document.createElement('button'); laas.type = 'button';
  laas.className = 'vback'; laas.textContent = 'Lås';
  const t = document.createElement('span'); t.className = 'vtitle';
  t.textContent = 'hub — status · dekryptert lokalt';
  bar.appendChild(laas); bar.appendChild(t);
  const fr = document.createElement('iframe'); fr.className = 'vframe';
  fr.setAttribute('title', 'hub — status'); fr.srcdoc = html;
  o.appendChild(bar); o.appendChild(fr);
  document.body.appendChild(o); document.body.style.overflow = 'hidden';
  laas.addEventListener('click', () => {
    try{ sessionStorage.removeItem('hub_k'); localStorage.removeItem('hub_k'); }catch(e){}
    location.reload();
  });
}
async function tryUnlock(pw){
  const key = await deriveKey(pw);
  await dec(key, B.canary);            // kaster ved feil passord
  KEY = key;
  // Nøkkelen (aldri passordet) caches: sessionStorage per fane, eller
  // localStorage hvis «husk på denne enheten» er valgt — Lås tømmer begge.
  try{ const raw = await crypto.subtle.exportKey('raw', key);
       const b = btoa(String.fromCharCode(...new Uint8Array(raw)));
       ($('rem').checked ? localStorage : sessionStorage).setItem('hub_k', b); }catch(e){}
  await visDash(key);
}
$('form').addEventListener('submit', async e => {
  e.preventDefault(); $('err').textContent = '';
  const btn = e.target.querySelector('button'); btn.disabled = true;
  try{ await tryUnlock($('pw').value); }
  catch(err){ $('err').textContent = 'Feil passord, prøv igjen.'; }
  btn.disabled = false;
});
// Gjenopprett (nøkkel, aldri passord): fane-cache først, så husket enhet
(async () => {
  let raw = null;
  try{ raw = sessionStorage.getItem('hub_k') || localStorage.getItem('hub_k'); }catch(e){}
  if (!raw) return;
  try{
    const key = await crypto.subtle.importKey('raw', b64(raw), {name:'AES-GCM'}, true, ['decrypt']);
    await dec(key, B.canary);
    KEY = key; await visDash(key);
  }catch(e){ try{ sessionStorage.removeItem('hub_k'); localStorage.removeItem('hub_k'); }catch(_){} }
})();
</script>
