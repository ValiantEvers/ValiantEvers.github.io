<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f4efe6;
    --warm: #faf7f1;
    --navy: #0d1e30;
    --navy-2: #1a3352;
    --green: #2e9b68;
    --green-light: #eaf6f0;
    --border: #e2ddd4;
    --muted: #7a8a9a;
    --font-display: 'Cormorant Garamond', serif;
    --font-body: 'Manrope', sans-serif;
  }

  html { scroll-behavior: smooth; }
  body { background: var(--bg); color: var(--navy); font-family: var(--font-body); min-height: 100vh; }

  @keyframes fadeIn  { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
  @keyframes slideUp { from { opacity:0; transform:translateY(32px); } to { opacity:1; transform:translateY(0); } }
  @keyframes pulse   { 0%,100% { opacity:1; } 50% { opacity:0.6; } }

  #progress-bar-track {
    position: fixed; top: 0; left: 0; right: 0; height: 3px;
    background: rgba(0,0,0,0.08); z-index: 100;
  }
  #progress-bar-fill {
    height: 100%; background: var(--green);
    transition: width 0.5s cubic-bezier(0.4,0,0.2,1);
    border-radius: 0 2px 2px 0;
  }
  #step-pill {
    position: fixed; top: 12px; right: 16px; z-index: 101;
    background: var(--warm); border: 1px solid var(--border);
    border-radius: 99px; padding: 6px 14px;
    font-family: var(--font-body); font-size: 12px; font-weight: 700;
    color: var(--muted); letter-spacing: 0.05em;
    box-shadow: 0 2px 12px rgba(0,0,0,0.07);
    transition: opacity 0.3s;
  }
  #tweaks-panel {
    display: none; position: fixed; bottom: 24px; right: 24px; z-index: 200;
    background: var(--warm); border: 1px solid var(--border);
    border-radius: 20px; padding: 20px 22px; width: 280px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.12);
    animation: fadeIn 0.2s ease;
  }
  #tweaks-panel.visible { display: block; }
  .tweak-label { font-family: var(--font-body); font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; display: block; }
  .tweak-row { margin-bottom: 16px; }
  .tweak-select { width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: 10px; background: white; font-family: var(--font-body); font-size: 13px; font-weight: 600; color: var(--navy); cursor: pointer; }

  /* checklist */
  .checklist { list-style: none; display: flex; flex-direction: column; gap: 12px; }
  .checklist li { display: flex; gap: 14px; align-items: flex-start; }
  .checklist li .num {
    flex-shrink: 0; width: 28px; height: 28px; border-radius: 50%;
    background: var(--green); color: white;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-body); font-size: 12px; font-weight: 800;
    margin-top: 1px;
  }
  .checklist li p { font-family: var(--font-body); font-size: 15px; line-height: 1.6; color: var(--navy); }

  /* errors list */
  .error-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }
  .error-list li { display: flex; gap: 14px; align-items: flex-start; padding: 14px 16px; background: white; border: 1px solid var(--border); border-radius: 14px; }
  .error-num { flex-shrink: 0; font-family: var(--font-body); font-size: 11px; font-weight: 800; color: var(--muted); width: 20px; padding-top: 2px; }
  .error-text { font-family: var(--font-body); font-size: 14px; line-height: 1.55; color: var(--navy); }
</style>

<div id="progress-bar-track"><div id="progress-bar-fill" style="width:0%"></div></div>

<div id="tweaks-panel"></div>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

// ─── Tweaks defaults ──────────────────────────────────────────
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accentColor": "#2e9b68",
  "bgTone": "beige",
  "fontSize": "comfortable"
}/*EDITMODE-END*/;

function applyTweaks(t) {
  const r = document.documentElement;
  r.style.setProperty('--green', t.accentColor);
  r.style.setProperty('--green-light', t.accentColor + '20');
  const bgs = { beige: '#f4efe6', slate: '#eff2f4', cream: '#f8f4ec' };
  r.style.setProperty('--bg', bgs[t.bgTone] || bgs.beige);
  const sizes = { compact: '14px', comfortable: '16px', large: '18px' };
  document.body.style.fontSize = sizes[t.fontSize] || '16px';
}

// ─── Read localStorage ────────────────────────────────────────
function getRiskProfile() {
  try { return localStorage.getItem('fnti2_riskProfile') || null; } catch { return null; }
}
function getStockPercent() {
  try { return parseInt(localStorage.getItem('fnti2_stockPercent') || '65'); } catch { return 65; }
}
function getSavedStep() {
  try { return parseInt(localStorage.getItem('fnti3_step') || '0'); } catch { return 0; }
}
function saveStep(s) {
  try { localStorage.setItem('fnti3_step', String(s)); } catch {}
}

// ─── Shared UI ────────────────────────────────────────────────
function Card({ children, style }) {
  return (
    <div style={{
      background: 'var(--warm)', border: '1px solid var(--border)',
      borderRadius: '20px', padding: '28px',
      boxShadow: '0 2px 16px rgba(0,0,0,0.04)',
      ...style,
    }}>{children}</div>
  );
}

function SectionLabel({ children }) {
  return (
    <p style={{ fontFamily: 'var(--font-body)', fontSize: '11px', fontWeight: '700', letterSpacing: '0.09em', textTransform: 'uppercase', color: 'var(--muted)', marginBottom: '14px' }}>
      {children}
    </p>
  );
}

function Callout({ children, color, icon }) {
  const c = color || 'var(--green)';
  return (
    <div style={{ background: c + '12', border: `1px solid ${c}30`, borderRadius: '14px', padding: '18px 20px', display: 'flex', gap: '12px' }}>
      {icon && <span style={{ fontSize: '18px', flexShrink: 0, marginTop: '1px' }}>{icon}</span>}
      <p style={{ fontFamily: 'var(--font-body)', fontSize: '14px', lineHeight: '1.65', color: 'var(--navy)' }}>{children}</p>
    </div>
  );
}

function H2({ children }) {
  return (
    <h2 style={{ fontFamily: 'var(--font-display)', fontSize: 'clamp(30px, 5vw, 46px)', fontWeight: '700', color: 'var(--navy)', lineHeight: 1.1, marginBottom: '10px' }}>{children}</h2>
  );
}

function Lead({ children }) {
  return (
    <p style={{ fontFamily: 'var(--font-body)', fontSize: '16px', color: 'var(--muted)', lineHeight: '1.7', marginBottom: '32px' }}>{children}</p>
  );
}

function Quote({ children, attr }) {
  return (
    <Card style={{ background: 'var(--navy)', border: 'none' }}>
      <p style={{ fontFamily: 'var(--font-display)', fontSize: '22px', fontWeight: '600', fontStyle: 'italic', color: 'white', lineHeight: 1.45 }}>
        "{children}"
      </p>
      {attr && <p style={{ fontFamily: 'var(--font-body)', fontSize: '12px', color: 'rgba(255,255,255,0.35)', marginTop: '12px', letterSpacing: '0.04em' }}>{attr}</p>}
    </Card>
  );
}

// ─── STEP CONTENTS ────────────────────────────────────────────

function TaxCallout() {
  const [open, setOpen] = useState(false);
  return (
    <div style={{ background: 'rgba(46,155,104,0.12)', border: '1px solid rgba(46,155,104,0.3)', borderRadius: '14px', padding: '18px 20px' }}>
      <div style={{ display: 'flex', gap: '12px', alignItems: 'flex-start' }}>
        <span style={{ fontSize: '18px', flexShrink: 0, marginTop: '1px' }}>📊</span>
        <div style={{ flex: 1 }}>
          <p style={{ fontFamily: 'var(--font-body)', fontSize: '14px', lineHeight: '1.65', color: 'var(--navy)' }}>
            Gevinsten beskattes med 37,84 %, men skjermingsfradraget reduserer det skattepliktige beløpet over tid – jo lenger du er investert, jo mindre skatt betaler du relativt sett.
          </p>
          <button
            onClick={() => setOpen(o => !o)}
            style={{
              marginTop: '10px', padding: '6px 14px',
              borderRadius: '99px', border: '1.5px solid rgba(46,155,104,0.4)',
              background: open ? 'var(--green)' : 'transparent',
              color: open ? 'white' : 'var(--green)',
              fontFamily: 'var(--font-body)', fontSize: '12px', fontWeight: '700',
              cursor: 'pointer', transition: 'all 0.2s', letterSpacing: '0.03em',
            }}
            onMouseOver={e => { if (!open) { e.currentTarget.style.background = 'rgba(46,155,104,0.1)'; } }}
            onMouseOut={e => { if (!open) { e.currentTarget.style.background = 'transparent'; } }}
          >
            {open ? 'Lukk eksempel ↑' : 'Se et eksempel →'}
          </button>

          {open && (
            <div style={{ marginTop: '14px', padding: '16px', background: 'white', borderRadius: '12px', border: '1px solid rgba(46,155,104,0.2)', animation: 'fadeIn 0.25s ease both' }}>
              <p style={{ fontFamily: 'var(--font-body)', fontSize: '12px', fontWeight: '800', color: 'var(--green)', letterSpacing: '0.07em', textTransform: 'uppercase', marginBottom: '12px' }}>Eksempel – 100 000 kr over 10 år</p>
              <div style={{ display: 'flex', flexDirection: 'column', gap: '8px' }}>
                {[
                  { label: 'Investert beløp', val: '100 000 kr' },
                  { label: 'Verdi etter 10 år', val: '200 000 kr' },
                  { label: 'Gevinst', val: '100 000 kr' },
                  { label: 'Skjerming (ca. 3 % p.a.)', val: '− 30 000 kr', muted: true },
                  { label: 'Skattepliktig gevinst', val: '70 000 kr', bold: true },
                ].map((row, i) => (
                  <div key={i} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '7px 0', borderBottom: i < 4 ? '1px solid var(--border)' : 'none' }}>
                    <p style={{ fontFamily: 'var(--font-body)', fontSize: '13px', color: row.muted ? 'var(--green)' : 'var(--muted)' }}>{row.label}</p>
                    <p style={{ fontFamily: 'var(--font-body)', fontSize: '13px', fontWeight: row.bold ? '800' : '600', color: row.muted ? 'var(--green)' : 'var(--navy)' }}>{row.val}</p>
                  </div>
                ))}
              </div>
              <div style={{ marginTop: '12px', padding: '10px 14px', borderRadius: '10px', background: 'var(--green-light)', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                <p style={{ fontFamily: 'var(--font-body)', fontSize: '13px', fontWeight: '700', color: 'var(--navy)' }}>Skatt å betale<br /><span style={{ fontWeight: '400', fontSize: '12px', color: 'var(--muted)' }}>70 000 × 37,84 %</span></p>
                <p style={{ fontFamily: 'var(--font-body)', fontSize: '18px', fontWeight: '800', color: 'var(--green)' }}>26 488 kr</p>
              </div>
              <p style={{ fontFamily: 'var(--font-body)', fontSize: '12px', color: 'var(--muted)', marginTop: '10px', lineHeight: '1.6' }}>
                Uten skjerming ville skatten vært <strong>37 840 kr</strong>. Effektiv skattesats på gevinsten blir <strong>26,49 %</strong> i stedet for 37,84 %.
              </p>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}


function StepInfo() {
  const cards = [
    {
      title: 'Hvilken konto skal du velge?',
      content: (
        <div style={{ display: 'flex', flexDirection: 'column', gap: '10px', marginTop: '14px' }}>
          {[
            { name: 'ASK – Aksjesparekonto', desc: 'Anbefalt for de fleste. Utsatt skatt, fleksibel, passer fond og aksjer.', highlight: true },
            { name: 'IPS', desc: 'Kun for pensjonssparing. Binder pengene til du er 62 år.' },
            { name: 'Vanlig konto', desc: 'Ingen skattefordel. Bruk kun unntaksvis.' },
          ].map((row, i) => (
            <div key={i} style={{
              padding: '14px 16px', borderRadius: '12px',
              border: `1.5px solid ${row.highlight ? 'var(--green)' : 'var(--border)'}`,
              background: row.highlight ? 'var(--green-light)' : 'white',
            }}>
              <p style={{ fontFamily: 'var(--font-body)', fontSize: '14px', fontWeight: '700', color: 'var(--navy)' }}>{row.name}</p>
              <p style={{ fontFamily: 'var(--font-body)', fontSize: '13px', color: 'var(--muted)', marginTop: '4px', lineHeight: 1.5 }}>{row.desc}</p>
            </div>
          ))}
          <Callout color="var(--green)" icon="✓">For de fleste er ASK riktig valg.</Callout>
        </div>
      ),
    },
    {
      title: 'Hva koster det å handle?',
      content: (
        <div style={{ display: 'flex', flexDirection: 'column', gap: '10px', marginTop: '14px' }}>
          {[
            { label: 'Fond på Nordnet', val: 'Gratis å kjøpe og selge' },
            { label: 'Aksjer', val: 'Kurtasje per handel (fra ca. 0,05%)' },
            { label: 'Forvaltningsgebyr', val: 'Trekkes automatisk – ikke synlig som transaksjon' },
          ].map((row, i) => (
            <div key={i} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '12px 16px', background: 'white', borderRadius: '10px', border: '1px solid var(--border)', gap: '12px' }}>
              <p style={{ fontFamily: 'var(--font-body)', fontSize: '13px', fontWeight: '600', color: 'var(--navy)' }}>{row.label}</p>
              <p style={{ fontFamily: 'var(--font-body)', fontSize: '13px', color: 'var(--muted)', textAlign: 'right' }}>{row.val}</p>
            </div>
          ))}
        </div>
      ),
    },
    {
      title: 'Hva skjer når du vil selge?',
      content: (

        }}>

            padding: '14px 28px', borderRadius: '99px',
            border: '2px solid var(--border)', background: 'transparent',
            cursor: 'pointer', fontFamily: 'var(--font-body)', fontSize: '14px',
            fontWeight: '700', color: 'var(--muted)', transition: 'all 0.2s',
          }}
            onMouseOver={e => { e.currentTarget.style.borderColor = 'var(--navy)'; e.currentTarget.style.color = 'var(--navy)'; }}
            onMouseOut={e => { e.currentTarget.style.borderColor = 'var(--border)'; e.currentTarget.style.color = 'var(--muted)'; }}
          >← Tilbake</button>

          <div style={{ textAlign: 'right' }}>
            {!isLast && (
              <p style={{ fontFamily: 'var(--font-body)', fontSize: '12px', color: 'var(--muted)', marginBottom: '8px', letterSpacing: '0.04em' }}>
                Neste: {STEPS[idx + 1]?.label}
              </p>
            )}
            <button onClick={onNext} style={{
              padding: '16px 40px', background: 'var(--green)', color: 'white',
              border: 'none', borderRadius: '99px', cursor: 'pointer',
              fontFamily: 'var(--font-body)', fontSize: '15px', fontWeight: '800',
              letterSpacing: '0.03em', transition: 'all 0.2s',
            }}
              onMouseOver={e => e.currentTarget.style.transform = 'scale(1.03)'}
              onMouseOut={e => e.currentTarget.style.transform = 'scale(1)'}
            >
              {isLast ? 'Se oppsummering →' : 'Neste steg →'}
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

// ─── TWEAKS PANEL ─────────────────────────────────────────────
function TweaksPanel({ tweaks, setTweaks }) {
  const update = (key, val) => {
    const next = { ...tweaks, [key]: val };
    setTweaks(next);
    applyTweaks(next);
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits: next }, '*');
  };
  return (
    <div>
      <p style={{ fontFamily: 'var(--font-body)', fontWeight: '800', fontSize: '14px', color: 'var(--navy)', marginBottom: '16px' }}>Tweaks</p>
      <div className="tweak-row">
        <span className="tweak-label">Aksentfarge</span>
        <input type="color" value={tweaks.accentColor} onChange={e => update('accentColor', e.target.value)}
          style={{ width: '100%', height: '36px', borderRadius: '10px', border: '1px solid var(--border)', cursor: 'pointer', padding: '2px' }} />
      </div>
      <div className="tweak-row">
        <span className="tweak-label">Bakgrunn</span>
        <select className="tweak-select" value={tweaks.bgTone} onChange={e => update('bgTone', e.target.value)}>
          <option value="beige">Varm beige</option>
          <option value="slate">Kjølig slate</option>
          <option value="cream">Ren krem</option>
        </select>
      </div>
      <div className="tweak-row">
        <span className="tweak-label">Tekststørrelse</span>
        <select className="tweak-select" value={tweaks.fontSize} onChange={e => update('fontSize', e.target.value)}>
          <option value="compact">Kompakt</option>
          <option value="comfortable">Komfortabel</option>
          <option value="large">Stor</option>
        </select>
      </div>
    </div>
  );
}

// ─── APP ──────────────────────────────────────────────────────
function App() {
  const riskProfileRaw = getRiskProfile();
  const riskProfile = riskProfileRaw || 'balansert';
  const hasPlan = !!riskProfileRaw;

  const saved = getSavedStep();
  const [screen, setScreen] = useState(saved === 99 ? 'final' : saved > 0 ? 'step' : 'hero');
  const [step, setStep] = useState(Math.max(1, Math.min(saved || 1, STEPS.length)));
  const [tweaks, setTweaks] = useState(TWEAK_DEFAULTS);
  const [tweaksOpen, setTweaksOpen] = useState(false);

  useEffect(() => { applyTweaks(tweaks); }, []);

  const goStart = () => {
    setScreen('step'); setStep(1); saveStep(1);
    document.getElementById('step-pill').style.opacity = 1;
  };
  const goNext = () => {
    if (step >= STEPS.length) { setScreen('final'); saveStep(99); }
    else { const ns = step + 1; setStep(ns); saveStep(ns); }
  };
  const goBack = () => {
    if (step === 1) {
      setScreen('hero');
      document.getElementById('step-pill').style.opacity = 0;
      document.getElementById('progress-bar-fill').style.width = '0%';
      saveStep(0);
    } else {
      const ns = step - 1; setStep(ns); saveStep(ns);
    }
  };

  // Tweaks wiring
  useEffect(() => {
    const handler = (e) => {
      if (e.data?.type === '__activate_edit_mode') setTweaksOpen(true);
      if (e.data?.type === '__deactivate_edit_mode') setTweaksOpen(false);
    };
    window.addEventListener('message', handler);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', handler);
  }, []);

  useEffect(() => {
    const container = document.getElementById('tweaks-panel');
    if (tweaksOpen) {
      container.classList.add('visible');
      ReactDOM.render(<TweaksPanel tweaks={tweaks} setTweaks={setTweaks} />, container);
    } else {
      container.classList.remove('visible');
    }
  }, [tweaksOpen, tweaks]);

  if (screen === 'hero') return <Hero onStart={goStart} hasPlan={hasPlan} />;
  if (screen === 'final') return <Final />;
  return <StepView step={step} riskProfile={riskProfile} onNext={goNext} onBack={goBack} />;
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
