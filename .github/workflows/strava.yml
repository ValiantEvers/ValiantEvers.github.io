name: Fetch Strava Activity

on:
  schedule:
    - cron: '0 5 * * *'  # Daily 05:00 UTC (07:00 norsk sommertid) — nedjustert fra hver 6. time 2026-07-10
  workflow_dispatch:        # Manual trigger

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Fetch latest Strava activity
        run: |
          # Get fresh access token using refresh token
          TOKEN_RESPONSE=$(curl -s -X POST https://www.strava.com/oauth/token \
            -d client_id=${{ secrets.STRAVA_CLIENT_ID }} \
            -d client_secret=${{ secrets.STRAVA_CLIENT_SECRET }} \
            -d refresh_token=${{ secrets.STRAVA_REFRESH_TOKEN }} \
            -d grant_type=refresh_token)

          ACCESS_TOKEN=$(echo "$TOKEN_RESPONSE" | jq -r '.access_token' 2>/dev/null || true)

          if [ "$ACCESS_TOKEN" = "null" ] || [ -z "$ACCESS_TOKEN" ]; then
            echo "Failed to get access token"
            echo "$TOKEN_RESPONSE"
            exit 1
          fi

          # Fetch latest activity
          ACTIVITY=$(curl -s "https://www.strava.com/api/v3/athlete/activities?per_page=1" \
            -H "Authorization: Bearer $ACCESS_TOKEN")

          # Validate that Strava returned a JSON array before parsing
          if ! echo "$ACTIVITY" | jq -e 'type == "array"' > /dev/null 2>&1; then
            echo "Unexpected activities response:"
            echo "$ACTIVITY"
            exit 1
          fi

          # Extract relevant fields and save as clean JSON
          echo "$ACTIVITY" | jq '[.[] | {
            name: .name,
            type: .type,
            sport_type: .sport_type,
            distance: (.distance / 1000 * 100 | round / 100),
            moving_time: .moving_time,
            elapsed_time: .elapsed_time,
            total_elevation_gain: .total_elevation_gain,
            start_date: .start_date_local,
            average_speed: (.average_speed * 3.6 * 100 | round / 100),
            max_speed: (.max_speed * 3.6 * 100 | round / 100),
            average_heartrate: .average_heartrate,
            max_heartrate: .max_heartrate,
            suffer_score: .suffer_score,
            id: .id
          }][0]' > strava.json

          cat strava.json

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add strava.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Update Strava activity"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push; then exit 0; fi
            echo "Push attempt $attempt rejected — retrying..."
            sleep 2
          done
          echo "Push failed after 3 attempts"
          exit 1
