name: Bygg nb-watch

# Aktivering: fjern '#'-en foran push-trigger nedenfor når du er klar til å
# la workflowen kjøre automatisk ved push til main. Inntil da kjør manuelt
# fra Actions-fanen.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  #   paths:
  #     - 'nb-watch-src/**'
  #     - '.github/workflows/build-nb-watch.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: nb-watch-src/package-lock.json

      - name: Installer dependencies
        working-directory: nb-watch-src
        run: npm ci

      - name: Bygg
        working-directory: nb-watch-src
        run: npm run build

      - name: Verifiser build-output
        run: |
          test -f nb-watch/index.html || (echo "Mangler index.html"; exit 1)
          test -d nb-watch/assets || (echo "Mangler assets/"; exit 1)
          echo "Build-output OK:"
          ls -la nb-watch/

      - name: Commit deploy-output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nb-watch/
          if git diff --cached --quiet; then
            echo "Ingen endringer i build-output — hopper over commit"
            exit 0
          fi
          git commit -m "Auto-deploy nb-watch [skip ci]"
          git push
