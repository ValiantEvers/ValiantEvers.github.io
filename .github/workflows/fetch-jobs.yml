name: Fetch jobs

on:
  schedule:
    - cron: "0 4 * * *"  # 04:00 UTC daglig (06:00 norsk sommertid / 05:00 norsk vintertid)
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    # 30 min (juli 2026): runtime er 7–8 min, men 13 kilder spiser margin —
    # en timeout midt i kjøringen mister alt før push.
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: pip install requests cryptography playwright
      - name: Install Playwright Chromium
        run: playwright install chromium --with-deps
      - env:
          STRATEGI_PASSWORD: ${{ secrets.STRATEGI_PASSWORD }}
          GIST_PAT: ${{ secrets.GIST_PAT }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: python scripts/fetch_jobs.py
