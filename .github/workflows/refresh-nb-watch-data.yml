name: nb-watch pipeline

# Konsolidert workflow: henter ferske data fra Norges Bank og SSB, bygger
# Vite-output, og committer endringer til main i én og samme run.
#
# Bakgrunn: commits gjort av GITHUB_TOKEN trigger ikke nye workflow-runs, så
# en kjede der refresh-data → push → trigger build virker ikke uten en PAT.
# Vi løser det ved å samle fetch + build + commit i én pipeline.
#
# Hybrid logikk per trigger:
#   schedule          → fetch_all.py + cp-mirror JSON (ingen rebuild)
#   workflow_dispatch → fetch_all.py + full Vite-build (alt fra bunn)
#   push              → kun full Vite-build (UI-fiks, ingen data-refresh)

on:
  schedule:
    # 06:00 UTC = 07:00 (vinter) / 08:00 (sommer) lokal tid. SSB og Norges
    # Bank publiserer typisk på morgenen.
    - cron: '0 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'nb-watch-src/**'
      - '!nb-watch-src/public/data/**'
      - '.github/workflows/refresh-nb-watch-data.yml'

permissions:
  contents: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true
          fetch-depth: 1

      - uses: actions/setup-python@v6
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: nb-watch-src/scripts/requirements.txt

      - uses: actions/setup-node@v6
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: nb-watch-src/package-lock.json

      - name: Installer Python-dependencies
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        working-directory: nb-watch-src
        run: pip install -r scripts/requirements.txt

      - name: Installer Node-dependencies
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        working-directory: nb-watch-src
        run: npm ci

      - name: Hent ferske data
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        working-directory: nb-watch-src
        run: python scripts/fetch_all.py

      - name: Speil data til deploy-mappe (cron, ingen rebuild)
        # Kun schedule. workflow_dispatch og push kjører full Vite-build,
        # som speiler public/data/ inn i nb-watch/data/ automatisk.
        if: github.event_name == 'schedule'
        run: |
          mkdir -p nb-watch/data
          cp -f nb-watch-src/public/data/*.json nb-watch/data/

      - name: Bygg
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        working-directory: nb-watch-src
        run: npm run build

      - name: Verifiser build-output
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
        run: |
          test -f nb-watch/index.html || (echo "Mangler index.html"; exit 1)
          test -d nb-watch/assets || (echo "Mangler assets/"; exit 1)
          echo "Build-output OK:"
          ls -la nb-watch/

      - name: Commit endringer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nb-watch-src/public/data/ nb-watch/
          if git diff --cached --quiet; then
            echo "Ingen endringer å committe"
            exit 0
          fi
          case "${{ github.event_name }}" in
            schedule)          msg="nb-watch: auto-refresh data [skip ci]" ;;
            workflow_dispatch) msg="nb-watch: manuell pipeline [skip ci]" ;;
            push)              msg="nb-watch: rebuild fra kode-endring [skip ci]" ;;
            *)                 msg="nb-watch: auto-update [skip ci]" ;;
          esac
          git commit -m "$msg"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push; then exit 0; fi
            echo "Push attempt $attempt rejected — retrying..."
            sleep 2
          done
          echo "Push failed after 3 attempts"
          exit 1
