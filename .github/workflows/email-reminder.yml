name: Email reminder

on:
  schedule:
    - cron: "0 7 * * *"  # Daglig 07:00 UTC (etter fetch-jobs som er 06:00 UTC)
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests cryptography
      - env:
          STRATEGI_PASSWORD: ${{ secrets.STRATEGI_PASSWORD }}
          GIST_PAT: ${{ secrets.GIST_PAT }}
          GIST_ID: ${{ secrets.GIST_ID }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
        run: python scripts/email_reminder.py
