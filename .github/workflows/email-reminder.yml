name: Email reminder

on:
  # schedule fjernet 2026-08-31 (jobbsøket avviklet 28.08) — gjeninnfør
  # cron-blokken for å reaktivere daglige påminnelser
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install requests cryptography
      - env:
          STRATEGI_PASSWORD: ${{ secrets.STRATEGI_PASSWORD }}
          GIST_PAT: ${{ secrets.GIST_PAT }}
          GIST_ID: ${{ secrets.GIST_ID }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
        run: python scripts/email_reminder.py
