name: Bygg pensjonskalkulator

on:
  push:
    branches: [main]
    paths:
      - 'pensjonskalkulator-src/**'
      - '.github/workflows/build-pensjonskalkulator.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: pensjonskalkulator-src/package-lock.json

      - name: Installer dependencies
        working-directory: pensjonskalkulator-src
        run: npm ci

      - name: Bygg
        working-directory: pensjonskalkulator-src
        run: npm run build

      - name: Verifiser build-output
        run: |
          test -f pensjonskalkulator/index.html || (echo "Mangler index.html"; exit 1)
          test -d pensjonskalkulator/assets || (echo "Mangler assets/"; exit 1)
          echo "Build-output OK:"
          ls -la pensjonskalkulator/

      - name: Commit deploy-output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pensjonskalkulator/
          if git diff --cached --quiet; then
            echo "Ingen endringer i build-output — hopper over commit"
            exit 0
          fi
          git commit -m "Auto-deploy pensjonskalkulator [skip ci]"
          git push
